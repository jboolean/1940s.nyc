openapi: '3.0.3'
info:
  title: Prospector Fulfillment Order Status API
  description: |
    Fulfillment order status and account detail API.
    Behind the Prospector API Gateway, authentication is handled by JWT authorizer.

    Operations marked `x-whcc-api-key: true` additionally accept an API key
    or a WorkOS session token carrying the `apikey` scope. Operations without
    the marker accept only the `client` and `superadmin` scopes, and answer
    `403` to any other credential.

    Every operation declares `x-whcc-writes`: `true` when a successful call
    leaves behind something a later request can observe, `false` when it
    leaves nothing. An operation whose write no later request can undo also
    carries `x-whcc-irreversible: true`. An API key or session token reaches
    only the account bound to it, and cannot act on another.

    The event subscriptions operations answer `application/problem+json` with a
    stable `code`, and treat `status` and `destination.type` as open enums: a
    value your client does not recognise must not fail the response.

    `GET /orders/{id}/form` is unmarked and answers only `client` and
    `superadmin`: it returns stored form HTML rather than a shape this
    specification defines.
  version: '2.2.0'

servers:
  - url: /
    description: Via design-editors-gateway API Gateway

security:
  - jwtAuth: []

paths:
  /api/v1/fulfillment/health:
    get:
      x-whcc-writes: false
      tags: [health]
      summary: Health check
      operationId: getHealth
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/UnsupportedApiVersion'

  /api/v1/fulfillment/openapi.yaml:
    get:
      x-whcc-writes: false
      tags: [docs]
      summary: OpenAPI specification
      operationId: getOpenApiSpec
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            text/yaml:
              schema:
                type: string
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/UnsupportedApiVersion'

  /api/v1/fulfillment/operations.json:
    get:
      x-whcc-writes: false
      tags: [docs]
      summary: Discovery manifest
      description: |
        This service's operations and the scopes each accepts, answered as of the moment you
        ask rather than from a separately maintained list, so what you read is what the service
        is serving now. Published so a host service can federate these operations into a single
        caller-facing discovery endpoint; the caller-specific filtering happens there, not here.

        No credential is involved and the answer is identical for every reader, so the response
        is publicly cacheable. Public routes -- this one, `health`, and `openapi.yaml` -- are
        excluded from the `operations` list.

        Every entry declares whether a successful call writes state that a later request can
        observe. `irreversible` appears only when no later request can undo that write; its
        absence means no such declaration was made, never that an operation is safe to reverse.
      operationId: getOperationsManifest
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The discovery manifest
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    contract,
                    contractVersion,
                    service,
                    generatedAt,
                    links,
                    operations,
                  ]
                properties:
                  contract:
                    type: string
                    example: whcc.discovery.manifest
                  contractVersion:
                    type: string
                    description: The shape's version, not this service's build version.
                    example: 1.0.0
                  service:
                    type: string
                    example: fulfillment
                  generatedAt:
                    type: string
                    format: date-time
                  links:
                    type: object
                    required: [service-desc]
                    properties:
                      service-desc:
                        type: string
                        example: /api/v1/fulfillment/openapi.yaml
                  operations:
                    type: array
                    items:
                      type: object
                      required:
                        [method, path, scopes, writes, description, notes]
                      properties:
                        method:
                          type: string
                          example: GET
                        path:
                          type: string
                          description: Gateway-absolute, not service-relative.
                          example: /api/v1/fulfillment/orders
                        scopes:
                          type: object
                          description: >-
                            Scope groups, conjunctive: every group present must be satisfied.
                            An empty group is omitted rather than emitted as an empty array.
                            Every published operation is authenticated, so `anyOf` is always
                            present; `allOf` and `noneOf` appear only when non-empty.
                          required: [anyOf]
                          properties:
                            anyOf:
                              type: array
                              items: { type: string }
                            allOf:
                              type: array
                              items: { type: string }
                            noneOf:
                              type: array
                              items: { type: string }
                        writes:
                          type: boolean
                          description: >-
                            Whether a successful call writes state that a later request can
                            observe. `false` means it leaves no such state.
                        irreversible:
                          type: boolean
                          description: >-
                            Present only when true: no later request can undo the successful
                            write. Its absence does not declare an operation reversible.
                        description:
                          type: string
                        notes:
                          type: array
                          items: { type: string }
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/UnsupportedApiVersion'

  /api/v1/fulfillment/orders:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Paginated order list
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of orders to return (1-100)
        - name: before
          in: query
          schema:
            type: string
          description: Opaque cursor token for backward pagination. Pass the `nextBefore` value from a previous response. Mutually exclusive with `after`.
        - name: after
          in: query
          schema:
            type: string
          description: Opaque cursor token for forward pagination. Pass the `nextAfter` value from a previous response. Mutually exclusive with `before`.
        - name: startAt
          in: query
          schema:
            type: string
          description: |
            Open the list at one order: an order number (`80055773`) or an
            order ID (`FO_KrWUwmUL4e5Q8z`). That order is the first item, and
            the orders older than it follow. `nextBefore` continues with older
            orders, and `nextAfter` returns the orders newer than it.

            This is the supported way to open the list at a given order. Don't
            build a `before` cursor for it -- cursors are opaque and their
            encoding may change.

            A value that isn't an order number or order ID, or names an order
            that doesn't exist or isn't on your account, is answered with
            `404`, never with a page starting at another order. Only
            `limit` can be sent with `startAt`; any other parameter is answered
            with `400`. An empty `startAt` is ignored.
        - name: search
          in: query
          schema:
            type: string
          description: |
            Broad order lookup: matches your order reference by substring, and
            matches an order number when the whole term is digits. `80055773`
            can return order 80055773; `80055773-proof` is a reference search
            only, and returns an order only if that order's reference contains
            it. Reach for `search` when you have a partial or uncertain
            reference; use `reference` when you have the exact one and want
            only the order carrying it. Mutually exclusive with `reference`.

            By default the reference match covers only your newest 50,000
            orders, which is every order for nearly every account; send
            `searchScope=all` to match references across all of them. An order
            number is found at any age either way. The response's
            `searchScope` says which orders the search covered.
        - name: searchScope
          in: query
          schema:
            type: string
            enum: [recent, all]
            default: recent
          description: |
            Which of your orders `search` matches by reference. `recent`
            matches your newest 50,000 orders; `all` matches every order, and
            takes longer on an account with more orders than that. Only with
            `search`: sent without it, or beside a blank one, the request is
            answered with `400`.
        - name: entryConfirmationId
          in: query
          schema:
            type: string
            format: uuid
          description: |
            The orders from one Order Submit API entry: the `ConfirmationID`
            that entry was given, which an order reports as
            `entry.confirmationId`. One entry can produce more than one order,
            so this narrows the list rather than identifying a single order.
            Mutually exclusive with `sourceConfirmationId`.
        - name: entryId
          in: query
          schema:
            type: string
            maxLength: 50
          description: |
            The orders imported under your own `EntryID`: the value an order
            reports as `entry.entryId`, matched without regard to case or
            trailing spaces. An `EntryID` you submit more than once matches
            every order each entry produced, so this narrows the list rather
            than identifying a single order. A value carrying a character no
            `EntryID` can hold is answered with `400`.
        - name: entrySequenceNumber
          in: query
          schema:
            type: string
            maxLength: 10
          description: |
            An order's `SequenceNumber` within its entry: the value an order
            reports as `entry.sequenceNumber`, matched as text without regard
            to case or trailing spaces, so `1` does not match `01`. Only with
            `entryId`, since a sequence number on its own matches an order from
            nearly every entry; sent without it, the request is answered with
            `400`.
        - name: sourceConfirmationId
          in: query
          deprecated: true
          schema:
            type: string
            format: uuid
          description: |
            Deprecated -- use `entryConfirmationId`, which takes the same
            value and matches the same orders. Mutually exclusive with it. Will
            be removed in a future major version.
        - name: sourceOrderId
          in: query
          schema:
            type: string
          description: |
            Source order the orders were created from. A source order can be
            split into more than one order.
        - name: reference
          in: query
          schema:
            type: string
          description: |
            Your own order reference, matched exactly: `1000` returns the order
            referenced `1000` and not the one referenced `10001`. Mutually
            exclusive with `search`.
        - name: receivedAfter
          in: query
          schema:
            type: string
          description: |
            Earliest order receipt time to include, inclusive. A date
            (`2026-01-31`) or a timestamp (`2026-01-31T09:00:00Z`); a value
            with no zone offset is read as UTC, and an offset must be between
            `-14:00` and `+14:00`.
        - name: receivedBefore
          in: query
          schema:
            type: string
          description: |
            Order receipt time to stop before, exclusive, so consecutive ranges
            do not overlap. Same accepted formats and offset range as
            `receivedAfter`, and must not be earlier than it.
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: |
            Paginated list of order summaries.

            `entryConfirmationId`, `entryId`, `entrySequenceNumber`,
            `sourceOrderId`, `reference` and the
            `receivedAfter`/`receivedBefore` range all narrow the same list and
            combine: an order is returned only when it satisfies every filter
            given. Each of them also composes with `before` and `after`.

            Each filter takes one value. A filter sent more than once, or sent
            in bracketed list form, is answered with `400` rather than
            ignored.

            Only the parameters listed above are accepted. Any other query
            parameter is answered with `400` naming it, rather than ignored --
            so a misspelled filter cannot come back as an unfiltered list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No order on your account matches `startAt`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

  /api/v1/fulfillment/orders/configured-products:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Search order configured products by source order ID
      operationId: searchOrderConfiguredProducts
      parameters:
        - name: sourceOrderId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Source order identifier to match against fulfillment orders
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Fulfillment orders with configured product IDs grouped by order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfiguredProductsSearchResponse'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            `sourceOrderId` is missing or blank, is not valid UTF-8, or a query
            parameter other than `sourceOrderId` was sent. An unknown parameter is
            refused rather than ignored.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

  /api/v1/fulfillment/orders/{id}:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Full order detail
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

  /api/v1/fulfillment/orders/{id}/cancel-actions:
    post:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Mint a cancel token for an order
      operationId: mintOrderCancelActions
      description: >
        Asks whether an order the calling account owns can be canceled, and --
        when it can -- returns a short-lived **cancel token** that
        `POST /orders/{id}/cancellation` accepts as the answer it was given.


        **The token is a promise with a clock on it.** Present it within 30
        seconds and the cancellation runs even if the order has moved on in the
        meantime: we said the order was cancellable and we keep that promise.
        Between 30 and 300 seconds eligibility is re-derived honestly -- the
        cancellation proceeds if the order is still eligible and is refused
        naming the blocking status if it is not. Past 300 seconds the token is
        refused and eligibility must be requested again.


        **Nobody is ever refused for the clock alone while their order is still
        eligible.** An older token on an order that is still cancellable is
        honoured; only a token past the 300 second cap is refused outright.


        ⚠️ **The clock runs from this call, not from a page render.** Mint when
        the photographer clicks cancel, not when the page listing their orders
        loads -- the promise is only that we will not move the goalposts between
        their click and their confirm.


        **A token is usable exactly once.** Redeeming it burns it; presenting it
        a second time is `409 cancel_token_already_used`, whatever the outcome
        of the first attempt was.


        **Minting is never part of `GET /orders/{id}`**, which is cacheable and
        would serve a token whose promise was already part-spent. Every response
        here is `no-store, private`. A token that is never redeemed simply
        expires.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelActionsRequest'
            examples:
              empty:
                summary: No body (or `{}`) -- this operation reads no field
                value: {}
      responses:
        '200':
          description: >
            The order is eligible, and a token was minted for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelActions'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
            Cache-Control:
              schema:
                type: string
              description: >
                Always `no-store, private` -- the response carries a live
                single-use token and must never be cached or replayed by an
                intermediary.
              example: 'no-store, private'
        '400':
          description: >
            Malformed request body: invalid JSON, a non-object top level, or any
            key at all. This operation reads no field, so a body carrying one is
            rejected rather than ignored -- most usefully when `cancelToken` is
            sent here instead of to `POST /orders/{id}/cancellation`, which
            silently accepted would look like a token this endpoint had honoured.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The identifier is not a recognizable order identifier. An identifier
            of a valid shape that names no order the account owns is a `422`
            with reason `order_not_found`, not a `404`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: >
            No token was minted, because the order cannot be canceled. `code` is
            always `order_not_cancelable`, and `cancelEligibility` is the
            order's own eligibility answer -- the same object, at the same
            property name, that order detail carries, and the same one the
            cancellation itself would refuse with. A promise is only ever made
            about an order we would honour it for.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CancellationProblemDetails'

  /api/v1/fulfillment/orders/{id}/cancellation:
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      x-whcc-irreversible: true
      tags: [orders]
      summary: Request cancellation of an order
      operationId: requestOrderCancellation
      description: >
        Asks to cancel an order the calling account owns. Both terminal states
        answer `200` and say which one happened: `canceled` means the order is
        voided and the money is on its way back, `cancellation_requested` means
        the ask is recorded and a person is finishing it. Either way the order
        shows `Request to Cancel Order` shortly afterwards, and a canceled one
        shows `Order Cancelled` after that.


        **Production is stopped before either answer is decided.** Which of the
        two a request ends in depends on what each production system reported
        while being stopped, not on anything read beforehand -- so an order this
        service cannot fully account for is finished by a person, with its work
        already halted when they get to it.


        **Once production has been stopped the request can no longer be
        refused.** Every `4xx` below is decided before anything is written. After
        that point every failure -- including a refused or partly completed void
        upstream -- answers `200 cancellation_requested`, because the alternative
        is telling a caller nothing happened while the order sits stopped on the
        production floor.


        **A retry is answered, never re-run.** A cancellation moves money, so one
        attempt at a time runs per order and it is
        never automatically re-attempted. A repeat arriving while an attempt is
        still running is `409 cancellation_in_progress`; a repeat arriving after
        one finished is answered `200` with the outcome that attempt reached, so
        the order is voided once and the money returned once however many times
        the request is sent. The record is kept for at least 24 hours -- its
        expiry is a floor, not a deadline -- after which a repeat is refused by
        the eligibility gate instead.


        **Eligibility is enforced here, not merely displayed.** The same answer
        an order carries at `cancelEligibility` gates this request, so an order
        that shows itself as ineligible is refused with `422` naming the reason,
        the status that blocked it, and when the order reached that status. An
        order that does not exist, or that belongs to another account, is
        refused the same way with reason `order_not_found`.


        **The response deliberately does not embed the order.** The statuses
        this request writes reach order detail after this call has answered, so
        an embedded order would show the order as it was beforehand. Re-read the
        order to see its new state.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
            examples:
              redeeming:
                summary: Redeeming a token from the mint operation
                value:
                  cancelToken: eyJvcmRlcklkIjoiRk9fQnYzakw4c041eFc2aFpmIn0.k7bR3xQ9pT2mN5wY
      responses:
        '200':
          description: >
            The request reached one of the two terminal states. Which one is in
            `outcome`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
            Cache-Control:
              schema:
                type: string
              description: Always `no-store, private` -- the answer describes a one-off state change.
              example: 'no-store, private'
        '400':
          description: >
            Either a malformed request body -- invalid JSON, a non-object top
            level, or a key this operation does not accept -- or a `cancelToken`
            that could not be honoured, in which case `code` is
            `cancel_token_invalid`.


            A query parameter is refused as well: this operation accepts none.


            That slug is deliberately opaque: an absent or empty token, a token
            this service did not mint, one minted for another account, and one
            minted for another order all answer identically, because in each
            case the caller is not the photographer holding a good confirmation
            for this order. Nothing was done to the order.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CancelTokenProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The identifier is not a recognizable order identifier. An identifier
            of a valid shape that names no order the account owns is a `422`
            with reason `order_not_found`, not a `404`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            Nothing was done to the order by this request, for one of two
            reasons.


            `cancellation_in_progress` -- a cancellation attempt for this order
            is already running. Wait for it rather than retrying immediately:
            once it finishes, a repeat is answered `200` with the outcome it
            reached.


            `cancel_token_already_used` -- the token was already redeemed. A
            token is usable exactly once, so a captured confirmation cannot be
            replayed. Mint a new one if the order still needs canceling; the
            first attempt's outcome is what stands.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CancellationInProgressProblemDetails'
                  - $ref: '#/components/schemas/CancelTokenProblemDetails'
        '422':
          description: >
            Nothing was done to the order, for one of two reasons.


            `order_not_cancelable` -- the order cannot be canceled, and
            `cancelEligibility` is the order's own eligibility answer: the same
            object, at the same property name, that order detail carries. A
            token still inside its 30 second grace is honoured instead of
            producing this, even where the order has moved on.


            `cancel_token_expired` -- the token is past its 300 second cap. It
            carries no `cancelEligibility`, because it is not an answer about
            the order: this does **not** mean the order cannot be canceled.
            Request eligibility again and, if it is still eligible, the new
            token will be honoured. Nobody is refused for the clock alone while
            their order is still cancelable.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CancellationProblemDetails'
                  - $ref: '#/components/schemas/CancelTokenProblemDetails'

