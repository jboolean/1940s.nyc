  /api/v1/fulfillment/orders/{id}/shipping:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Read an order's shipping state
      operationId: getOrderShipping
      description: |
        Where the order's parcel is going and which shipping option it holds,
        with the validator a change to that state must be made against.


        **This never refuses because an order cannot be changed.** An order
        whose shipping is not billed to your own carrier account answers `200`
        with `thirdPartyBilled` false and both option members `null`. That is a
        reading, not an error: it is how you learn that a change is not
        available for this order, and there is nothing to retry.


        **`ETag` is what a change is made against.** Take it from this response
        and send it back as `If-Match`. It is opaque: do not parse it, compare
        it, or construct one. It covers more than the address you can see, so a
        change made to the order by anyone between your read and your write is
        refused even when nothing you read has altered.


        **Do not take an `ETag` from anywhere else.** `GET /orders/{id}` is a
        cacheable read and carries no validator for this resource; this
        response is never stored, so that the validator you hold is the one
        that was current when you asked.


        `shippingOptionId` is the same identifier the shipping options list
        reports, so selecting an option is a copy rather than a lookup.

        **Refusal codes, and what to do about each.** Every refusal that came
        from the service behind this one carries a `code`; a refusal this
        service made itself carries none. `code` is an open string -- treat one
        you do not recognise as a refusal rather than as a fault, and read
        `detail` for the sentence to show a customer. There is no `Retry-After`
        on any of them: how long a failure lasts is not something this service
        knows, and a number here would be a promise about somebody else's
        incident.


        One code, `invalid-request`, is the service behind this one answering a
        `4xx` it did not classify further. Its status is that service's own and
        crosses unaltered, so it may be a status this operation does not
        otherwise list -- which is why `code` is what you branch on and the
        status is what you set your retry posture from.

        | Code | Status | Re-sending the identical request | Permanence |
        | --- | --- | --- | --- |
        | `order-not-found` | 404 | Refused again | Permanent: the service behind this one holds no such order. Worth reporting -- this service already found the order on your account. |
        | `shipment-not-found` | 404 | Refused again | Permanent for now: the order has no shipment record to read. Ordinary rather than wrong. |
        | `current-offer-unreadable` | 409 | Refused again | Permanent until the order itself is corrected; nothing you can send changes it. |
        | `invalid-request` | upstream's own 4xx | Refused again unless the request changes | Permanent for this request. |
        | `read-failed` | 502 | Safe, and worth retrying | Temporary: the service behind this one failed, not yours and not this one. |
        | `unhandled-error` | 502 | Safe, and worth retrying | Temporary, as above. |
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The order's shipping state, and the validator a change to it must carry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderShipping'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            ETag:
              $ref: '#/components/headers/ShippingETag'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShippingNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/ShippingUpstreamConflict'
        '502':
          $ref: '#/components/responses/ShippingBadGateway'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

    put:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [orders]
      summary: Replace an order's shipping state
      operationId: changeOrderShipping
      description: |
        Replace where an order's parcel is going, and optionally which option
        carries it, in one request.


        **This is a full-state replacement.** The address you send *is* the
        address the order will have: a member you leave out is a member you are
        clearing, not one you are leaving alone. `GET /orders/{id}/shipping`
        returns all ten address members for exactly this reason -- reading it,
        changing what you mean to change and sending the whole object back is a
        copy rather than a rebuild.


        **`shippingOptionId` is the one member absence does not clear.** Leave
        it out to keep the option the order holds. Sending the option it
        already holds is a satisfied request that changes nothing. To change
        it, send an `id` from `GET /orders/{id}/shipping/options`.


        **`If-Match` is required.** Send the `ETag` from `GET
        /orders/{id}/shipping`, unaltered. Sending none is refused `428`, and
        sending one that no longer matches is refused `412` -- which means
        somebody changed this order after your read, so re-read and decide
        again rather than retrying. Do not take an `ETag` from `GET
        /orders/{id}`: it is a cacheable read and carries no validator for this
        resource.


        **What is corrected for you, and what is refused.** `country` is
        upshifted, so `us` and `US` are the same country. `phone` is sent on as
        E.164: `7185551234`, `718-555-1234`, `(718) 555-1234`, `718.555.1234`
        and `1-718-555-1234` are all read as `+17185551234`, and a number this
        service cannot read -- one carrying letters or an extension -- is
        refused rather than guessed at. Every member is trimmed, and a member
        that is blank or only spaces is treated as cleared. Nothing else is
        altered.


        **What an address must carry.** `addr1`, `city`, `zip` and `country`,
        plus at least one of `attn` and `name` -- the label needs somebody to
        address. A `US` address also needs a two-letter `state` and a `zip` of
        at least five characters; elsewhere `state` is optional, because much
        of the world has no state. Anything unusable is refused `422` before
        anything is written, with `invalidParams` naming each offending member.


        **The options list is computed for the address the order has
        now.** `GET /orders/{id}/shipping/options`, the price on each
        option and each option's `availability` all answer for the order
        as it stands, and there is no way to ask what would be offered for
        an address the order does not hold yet. So a request that sends a
        new `shipTo` and a new `shippingOptionId` together picks its
        option from a list computed for the address the order is leaving.


        **A change that moves the address is not refused on whether the
        carrier reaches the new one.** That verdict can only be read from
        the destination the order already has, so on a change that moves
        the address it is left unasked rather than answered, and the
        change is accepted with serviceability at the new address unknown.
        Choosing an option that cannot reach where the parcel is now going
        -- a FedEx option onto a PO Box, say -- is accepted rather than
        refused, and nothing re-checks it afterwards: the order stays on
        that option until somebody reads the options and changes it.


        **So re-read `GET /orders/{id}/shipping/options` after a change
        that moved the address.** Availability there normally reflects the
        new address within a few minutes of its being validated, and an
        option change sent after that is judged against it; some options
        are not re-checked against a new address at all and go on reading
        `unknown`. A change that leaves the address alone is judged
        against the address the order already has, so an option that
        cannot reach it is refused `422` `offer-not-available` with
        `reason` `not-serviceable`.


        **What a change of address can still be refused for.** Moving the
        address re-derives what the order owes -- its tax, any state
        delivery fee, any region surcharge -- and any of those can refuse
        a change the options list gave no hint of:
        `region-surcharge-withheld`, `boundary-crossing-withheld`,
        `derived-charge-withheld`, `credit-floor-withheld` and
        `negative-balance-withheld`. `offer-not-available` is answerable
        too, on the checks that do not depend on where the parcel is going
        -- read its `reason`: a change that moves the address can be
        answered `unknown-offer` or `not-billable-to-partner`, and cannot
        be answered `not-serviceable`. The table below says what
        re-sending each of them does and how permanent each is.


        **Preview it first.** `POST /orders/{id}/shipping/preview` takes
        this exact body and answers what this request would do -- the
        options at the address you are moving to, what the order would
        then owe, and the refusal this operation would give you -- without
        writing anything. Send the `ETag` it hands back as this
        operation's `If-Match` and you write exactly what you previewed.


        **Without a preview it is one call or two, and neither is free of
        risk.** Sending the address and the option together risks a
        refusal about money decided against a list computed for the
        address being left, or an acceptance onto an option that cannot
        reach the address being moved to. Sending the address first,
        re-reading the options once they reflect it, then sending the
        option costs a round trip -- and between the two calls the order
        sits at its new address on the option it already held, which may
        be no better suited to that address than the one you would have
        chosen. Pick on which outcome your integration can recover from;
        the two-call path is easier to reason about, not safe.


        **An option's price does not depend on the address; the order's
        total does.** Each figure in the options list comes from your
        account's own pricing, and moving the parcel does not move it.
        Tax, any state delivery fee and any region surcharge are all
        assessed against where the parcel is going, so a total shown to a
        customer beside an option price before an address change need not
        be the total the order owes after it.


        **A refusal that carries a `code` is upstream's own.** `code` is an
        open string -- treat one you do not recognise as a refusal rather than
        as a fault, and read `detail` for what to show a customer. A `422`
        carrying `invalidParams` and no `code` is this service refusing your
        request locally.


        Nothing is written when this operation refuses, whatever the status --
        with one exception, and it is the one exception worth reading about
        before you integrate.


        **A change is never begun without time to finish it, and the two
        outcomes that follow from that are told apart by their `code`.** This
        service refuses to start a change it has too little time left to
        complete: that is `503` `shipping_change_not_begun`, nothing was sent,
        your order and its `ETag` are untouched, and the identical request --
        same body, same `If-Match` -- is safe to send again straight away,
        unattended. It carries no `Retry-After` because the honest answer is
        *now*.


        The outcome the floor exists to make rare is `504`
        `shipping_change_unconfirmed`: the change was sent and no answer came
        back, so **whether it was applied is not known**. Do not simply
        re-send. Read `GET /orders/{id}/shipping`, see whether your change is
        there, and send the identical request again only if it is not -- using
        the `ETag` that read gives you. There is no reconciliation endpoint and
        no application view; the re-read is the whole of the recovery, and it
        is enough because this operation is a full-state replacement.


        **These two are the only codes this service owns on these routes**, and
        they are `snake_case` where every code from the service behind this one
        is `kebab-case` -- so the casing alone tells you which service decided.


        **Refusal codes, and what to do about each.** Every refusal that came
        from the service behind this one carries a `code`; a refusal this
        service made itself carries none. `code` is an open string -- treat one
        you do not recognise as a refusal rather than as a fault, and read
        `detail` for the sentence to show a customer. There is no `Retry-After`
        on any of them: how long a failure lasts is not something this service
        knows, and a number here would be a promise about somebody else's
        incident.


        One code, `invalid-request`, is the service behind this one answering a
        `4xx` it did not classify further. Its status is that service's own and
        crosses unaltered, so it may be a status this operation does not
        otherwise list -- which is why `code` is what you branch on and the
        status is what you set your retry posture from.

        | Code | Status | Re-sending the identical request | Permanence |
        | --- | --- | --- | --- |
        | `etag-mismatch` | 412 | **Do not.** Re-read `GET /orders/{id}/shipping` and decide again against what you find | Permanent for that validator; a fresh read gives you a usable one. |
        | `if-match-required` | 428 | Only with an `If-Match` added | Permanent until you send one. |
        | `invalid-address` | 422 | Refused again unless the address changes | Permanent for that address. |
        | `unwritable-fields` | 422 | Refused again unless the body changes | Permanent for that body. |
        | `offer-not-available` | 422 | Refused again while the offer stays unavailable | Read `reason`: it distinguishes "not yet" from "never", in the same vocabulary an option's `availability.reason` uses. |
        | `boundary-crossing-withheld` | 422 | Refused again | Permanent: a move to another country is not offered here. |
        | `credit-floor-withheld` | 422 | Refused again | Permanent: a rule about the account, not about the request. |
        | `region-surcharge-withheld` | 422 | Refused again | Permanent for that destination. |
        | `derived-charge-withheld` | 422 | Refused again until the charge can be priced; then safe unchanged, because nothing was written -- the address was not moved either | Permanent until a charge the change would add to the order, such as a state delivery fee, can be priced. |
        | `not-third-party-billed` | 409 | Refused again | Temporary in principle -- other programmes are expected later -- but permanent for this order today. |
        | `order-not-editable` | 409 | Refused again | Permanent: the order has moved past the point where its shipping can change. |
        | `negative-balance-withheld` | 409 | Refused again | Permanent until the account's balance is settled; a rule about the account, not about the request. |
        | `carrier-account-unresolvable` | 409 | Refused again | Permanent until the carrier account is registered; a property of the order, not of your request. |
        | `current-offer-unreadable` | 409 | Refused again | Permanent until the order itself is corrected. |
        | `order-not-found` | 404 | Refused again | Permanent: the service behind this one holds no such order. Worth reporting -- this service already found the order on your account. |
        | `shipment-not-found` | 404 | Refused again | Permanent for now: the order has no shipment record to change. |
        | `invalid-request` | upstream's own 4xx | Refused again unless the request changes | Permanent for this request. |
        | `read-failed` | 502 | Safe: nothing was written | Temporary: the service behind this one failed. |
        | `shipping-change-failed` | 502 | Safe: nothing was written | Temporary, as above. |
        | `unhandled-error` | 502 | Safe: nothing was written | Temporary, as above. |
        | `shipping_change_not_begun` | 503 | Safe, and the right thing to do: nothing was sent, so send the identical request again immediately | Temporary, and usually momentary: this request ran short of time, the next one need not. |
        | `shipping_change_unconfirmed` | 504 | **Not until you have re-read.** `GET /orders/{id}/shipping`, then re-send the identical request only if your change is not there | Temporary. What is unknown is this one attempt, not the order. |
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: If-Match
          in: header
          required: true
          description: >
            The `ETag` from `GET /orders/{id}/shipping`, unaltered. Opaque: do
            not parse, compare or construct one.
          schema:
            type: string
          example: '"a1b2c3"'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingChangeRequest'
      responses:
        '200':
          description: >
            The shipping state as it was written, and the validator a further
            change must carry -- so a second change needs no re-read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderShipping'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            ETag:
              $ref: '#/components/headers/ShippingETag'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body was not a JSON object, carried a key this operation does
            not read, or carried a `shippingOptionId` that was not a non-empty
            string. Unknown keys are refused rather than ignored, so a member
            you believed did something never silently does nothing -- and a
            blank `shippingOptionId` is refused rather than read as an
            omission, because omitting it is how you say "unchanged".


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShippingNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            A property of the order rather than of your request, so the
            identical request will keep being refused until the order changes.
            Read `code`: the order's shipping is not billed to your own carrier
            account, the order can no longer be edited, or the option it
            currently holds cannot be read. Re-sending does not help.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShippingProblemDetails'
        '412':
          description: >
            Your `If-Match` no longer matches this order's shipping state:
            something changed it after your read. Nothing was written. Re-read
            `GET /orders/{id}/shipping`, decide again against what you find,
            and send with the new `ETag` -- do not retry the same request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShippingProblemDetails'
        '422':
          description: >
            The request was understood and refused. **Two shapes, told apart by
            which member is present:** `invalidParams` and no `code` is this
            service refusing your address locally, and names each offending
            member -- fix them and re-send. A `code` is a refusal from the
            service behind this one, and re-sending the identical request will
            be refused identically; `offer-not-available` also carries a
            `reason` saying which predicate said no, in the same vocabulary an
            option's own availability uses.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AddressValidationProblemDetails'
                  - $ref: '#/components/schemas/ShippingProblemDetails'
        '428':
          description: >
            No `If-Match` was sent, so the change was refused rather than
            written blind. Read `GET /orders/{id}/shipping` and send its `ETag`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShippingProblemDetails'
        '502':
          description: >
            The change could not be made. The failure is in the service behind
            this one rather than in this one, so your order is unchanged and
            the request is safe to repeat.


            **A `code` is present when that service said what went wrong** --
            `read-failed`, `shipping-change-failed` or
            `unhandled-error`, relayed under this
            status because the failure is not this service's. Its absence
            means this service could not tell what happened, which is a
            different thing and is why the two are distinguishable rather
            than merged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnyShippingProblemDetails'
        '503':
          description: >
            **Two answers, told apart by whether `code` is present, and they
            want opposite things from you.**


            `shipping_change_not_begun` means this request ran short of time
            and the change was never attempted. Nothing was sent, your order
            and its `ETag` are untouched, and the identical request is safe to
            send again immediately.


            No `code` at all means shipping changes are not available in this
            environment yet: the route exists and is closed, so re-sending will
            not help. `GET /orders/{id}/shipping` still answers while this does
            not.


            Neither carries a `Retry-After` -- for the first the honest answer
            is *now*, and for the second how long it lasts is not something
            this service knows.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnyShippingProblemDetails'
        '504':
          description: >
            The change was sent to the service behind this one and no answer
            came back, so **whether it was applied is not known**. This is the
            one refusal on this operation that does not tell you what happened
            to your order.


            **Re-read before you re-send.** `GET /orders/{id}/shipping` says
            whether your change landed; if it did not, send the identical
            request again with the `ETag` that read gave you. Re-sending blind
            risks applying a change twice or applying one you have since
            decided against. There is no `Retry-After`: what you must do first
            is read, not wait.


            Distinct from `502`, which means the service behind this one
            answered and nothing was written -- that one is safe to repeat, and
            this one is not.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShippingProblemDetails'

  /api/v1/fulfillment/orders/{id}/shipping/options:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: List the shipping options an order may be moved to
      operationId: getOrderShippingOptions
      description: |
        What this order may be moved to ship on, priced for your account, with
        the option it currently holds marked `current`.


        **This list answers for the order as it stands.** Every option,
        its price and its `availability` are computed for the address the
        order has now, and there is no way to ask what would be offered
        for an address the order does not hold yet. An option taken from
        here and sent to `PUT /orders/{id}/shipping` alongside a new
        address was therefore picked from a list computed for the address
        the order is leaving.


        **To see the options at an address the order does not have yet,
        use `POST /orders/{id}/shipping/preview`.** It takes the write's
        body and answers the options at the destination that change would
        move to, what the order would then owe, and the refusal the write
        would give you -- without writing anything. That is the answer to
        the paragraph above, and it is what the `PUT`'s own description
        recommends before a combined change.


        **Prices are your own.** Each figure is resolved from your account's own
        pricing at the time of the order, so a later price change does not
        re-price it. An account with no pricing of its own is answered standard
        pricing rather than refused.


        **A price here does not depend on where the parcel is going; the
        order's total does.** Tax, any state delivery fee and any region
        surcharge are all assessed against the address, so a total shown
        to a customer beside an option price before an address change need
        not be the total the order owes after it.


        **Availability is three-valued, and `unknown` is not a refusal.** An
        option that reads `unknown` can still be chosen: it means a check has
        not been run, not that the answer was no, so an integration that hid
        `unknown` options would hide options that can be chosen. Read
        `availability.detail` for the sentence to show a customer.


        **After a change that moved the address, read this list again.**
        Availability normally reflects the new address within a few
        minutes of its being validated, and an option change sent after
        that is judged against it; until then, and for some options
        indefinitely, it reads `unknown`. Nothing re-checks a change that
        was already accepted, so an order can sit at a new address on an
        option that cannot reach it until somebody reads this list and
        changes it.


        **`estimatedDeliveryDate` is often absent, and that is ordinary.** Not
        every option is dated, and an option with no date is neither
        unavailable nor an error. A date is when the parcel would arrive if the
        carrier takes it, not a promise that it will.


        **This list carries no `ETag`, and `current` is advisory.** Take the
        validator for a change from `GET /orders/{id}/shipping`, which is also
        the authority on which option the order holds. The two can disagree if
        the order changes between your reads; if they do, re-read the shipping
        state.


        **An empty `options` list says why.** Where the order ships somewhere no
        option is offered for, `unavailable` carries the reason and the sentence
        explaining it.


        `id` is the same identifier `GET /orders/{id}/shipping` reports as
        `shippingOptionId`, so selecting an option is a copy rather than a
        lookup.

        **Refusal codes, and what to do about each.** Every refusal that came
        from the service behind this one carries a `code`; a refusal this
        service made itself carries none. `code` is an open string -- treat one
        you do not recognise as a refusal rather than as a fault, and read
        `detail` for the sentence to show a customer. There is no `Retry-After`
        on any of them: how long a failure lasts is not something this service
        knows, and a number here would be a promise about somebody else's
        incident.


        One code, `invalid-request`, is the service behind this one answering a
        `4xx` it did not classify further. Its status is that service's own and
        crosses unaltered, so it may be a status this operation does not
        otherwise list -- which is why `code` is what you branch on and the
        status is what you set your retry posture from.

        | Code | Status | Re-sending the identical request | Permanence |
        | --- | --- | --- | --- |
        | `not-third-party-billed` | 409 | Refused again | Temporary in principle -- this list serves orders billed to your own carrier account, and other programmes are expected later -- but permanent for this order today. |
        | `current-offer-unreadable` | 409 | Refused again | Permanent until the order itself is corrected; nothing you can send changes it. |
        | `order-not-found` | 404 | Refused again | Permanent: the service behind this one holds no such order. Worth reporting -- this service already found the order on your account. |
        | `shipment-not-found` | 404 | Refused again | Permanent for now: the order has no shipment record to enumerate against. |
        | `invalid-request` | upstream's own 4xx | Refused again unless the request changes | Permanent for this request. |
        | `read-failed` | 502 | Safe, and worth retrying | Temporary: the service behind this one failed, not yours and not this one. |
        | `unhandled-error` | 502 | Safe, and worth retrying | Temporary, as above. |
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The options this order may be moved to, in catalogue order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderShippingOptions'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShippingNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/ShippingUpstreamConflict'
        '502':
          $ref: '#/components/responses/ShippingBadGateway'
        '503':
          description: |
            One of two things, told apart by `Retry-After`:

            - **With `Retry-After`:** the request took too long to answer.
              Reading shipping options changes nothing, so it is safe to send
              again after the number of seconds it gives.
            - **Without `Retry-After`:** shipping changes are not available in
              this environment yet. Nothing is wrong with the order or the
              request, and no `Retry-After` is given because how long this
              lasts is not something this service knows.
              `GET /orders/{id}/shipping` still answers while this does not.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'

  /api/v1/fulfillment/orders/{id}/shipping/preview:
    post:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [orders]
      summary: Preview a shipping change without making it
      operationId: previewOrderShippingChange
      description: |
        What `PUT /orders/{id}/shipping` would do with this body: the state the
        change would leave, what the order would then be worth, the options at
        the destination it would move to, and the refusal the change would meet.


        **It takes the write's body, under the write's rules.** Same two
        members, same address validation, same refusals for a body this service
        cannot read. A body that only changes the option at the current address
        is a valid preview, and so is one that restates what the order already
        has.


        **Nothing is reserved.** A preview holds no option and no price for the
        write that follows it, and no validator moves. Ask as many times as you
        like, in any order, before you write.


        **`If-Match` is neither required nor read.** There is nothing to guard,
        so a concurrent change cannot refuse you an answer. The `ETag` that
        comes back is the order's **current** validator -- the same one `GET
        /orders/{id}/shipping` hands out, not one the change would produce. Send
        it as the write's `If-Match` to write exactly what you previewed: if
        somebody changes the order in between, that write is refused `412` and
        you preview again.


        **What this answers exactly.** The address the write would store, the
        shipping line it would bill, what the order would owe once tax, the
        statutory delivery fee and any surcharges are settled at the new
        destination, and every refusal about money or boundaries. These come
        from the write's own logic rather than a second copy of it, so a preview
        and the write it describes cannot disagree.


        **What it cannot answer yet: whether the carrier reaches a moved
        address.** That verdict is read from the destination the order already
        has, so on a change that moves the address every option's
        `availability` reads `unknown` -- which is not a refusal, and such an
        option can still be chosen. A preview will not tell you that an option
        cannot reach a new address, and neither will the write; re-read `GET
        /orders/{id}/shipping/options` after the change, where availability
        normally reflects the new address within a few minutes of its being
        validated.


        **Errors and answers are two different things here, and upstream's
        contract decides which is which.** A request that fails *before the
        change was judged* is refused, with the same status and `code` the write
        would answer -- your order was not found, the body was unreadable, the
        address was unusable, the service behind this one was unwell. A change
        that *was* judged and would be declined is a `200` whose `refusal`
        carries the problem document the write would have answered, whole. That
        second case is the question this route exists to answer, so it is a
        successful answer rather than an error: branch on `refusal`, not on the
        status.


        **`refusal` is the write's own problem document**, so the parser you
        already wrote for a refused `PUT` reads it unchanged. Its `status` is
        the status the write would have answered; the status of *this* response
        is `200`, because the preview succeeded.


        **`statutoryDeliveryFee` is already counted in `subtotal` and `total`.**
        It is published separately so you can name it to a customer, not because
        it is owed on top. Adding it to `total` charges it twice.


        **An option's price does not depend on the address; `amounts` does.**
        The figures in `options` come from your account's own pricing and do not
        move with the parcel. `amounts` is the whole order after the change, and
        tax, the statutory delivery fee and any region surcharge are all
        assessed against where the parcel is going.


        **Answers are never stored.** Every response here is `no-store,
        private`. There is no rate limit on this route today; if you are
        previewing at a rate that looks nothing like the writes that follow it,
        expect that to be revisited.


        **Refusal codes, and what to do about each.** These are the refusals
        that fail the preview, and each carries the status and `code` the write
        would answer for the same request. `code` is an open string -- treat one
        you do not recognise as a refusal rather than as a fault, and read
        `detail` for the sentence to show a customer. There is no `Retry-After`
        on any of them: how long a failure lasts is not something this service
        knows, and a number here would be a promise about somebody else's
        incident.


        Two codes the write publishes are deliberately absent, and their absence
        is the route's whole shape: `etag-mismatch` and `if-match-required`
        cannot be answered here, because no validator is read. So is
        `shipping_change_not_begun` -- nothing is begun that has to finish, so
        there is no floor below which this is not worth attempting.


        One code, `invalid-request`, is the service behind this one answering a
        `4xx` it did not classify further. Its status is that service's own and
        crosses unaltered, so it may be a status this operation does not
        otherwise list -- which is why `code` is what you branch on and the
        status is what you set your retry posture from.

        | Code | Status | Re-sending the identical request | Permanence |
        | --- | --- | --- | --- |
        | `invalid-address` | 422 | Refused again unless the address changes | Permanent for that address. |
        | `unwritable-fields` | 422 | Refused again unless the body changes | Permanent for that body. |
        | `not-third-party-billed` | 409 | Refused again | Temporary in principle -- other programmes are expected later -- but permanent for this order today. |
        | `order-not-editable` | 409 | Refused again | Permanent: the order has moved past the point where its shipping can change. |
        | `carrier-account-unresolvable` | 409 | Refused again | Permanent until the carrier account is registered; a property of the order, not of your request. |
        | `current-offer-unreadable` | 409 | Refused again | Permanent until the order itself is corrected. |
        | `order-not-found` | 404 | Refused again | Permanent: the service behind this one holds no such order. Worth reporting -- this service already found the order on your account. |
        | `shipment-not-found` | 404 | Refused again | Permanent for now: the order has no shipment record to change. |
        | `invalid-request` | upstream's own 4xx | Refused again unless the request changes | Permanent for this request. |
        | `read-failed` | 502 | Safe, and worth retrying | Temporary: the service behind this one failed. ⚠️ On this route it also covers a tax that could not be calculated for the address you asked about -- including an address the tax service will not accept -- so a repeat that keeps failing on the same address is worth treating as a fact about the address. |
        | `unhandled-error` | 502 | Safe, and worth retrying | Temporary, as above. |

        **Refusals answered inside a `200`, and what to do about each.** These
        are the refusals the write would answer once it had judged the change,
        reported in `refusal` rather than as an error -- the preview succeeded
        in finding out. The status column is the status the **write** would
        answer, which is what `refusal.status` carries; this response is `200`.
        Nothing was written either way.

        | Code | Status the write would answer | Re-sending the identical request | Permanence |
        | --- | --- | --- | --- |
        | `offer-not-available` | 422 | Refused again while the offer stays unavailable | Read `reason`: it distinguishes "not yet" from "never", in the same vocabulary an option's `availability.reason` uses. ⚠️ A change that moves the address is never answered `not-serviceable`, because serviceability at an address the order does not have yet is not known. |
        | `boundary-crossing-withheld` | 422 | Refused again | Permanent: a move to another country is not offered here. |
        | `region-surcharge-withheld` | 422 | Refused again | Permanent for that destination. |
        | `derived-charge-withheld` | 422 | Refused again until the charge can be priced | Permanent until a charge the change would add to the order, such as a state delivery fee, can be priced. |
        | `credit-floor-withheld` | 422 | Refused again | Permanent: a rule about the account, not about the request. |
        | `negative-balance-withheld` | 409 | Refused again | Permanent until the account's balance is settled; a rule about the account, not about the request. |
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingChangeRequest'
      responses:
        '200':
          description: >
            What the change would do. `refusal` is null where the change would
            be made and carries the write's own problem document where it would
            not; `shippingCharge` and `amounts` are null exactly when `refusal`
            is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderShippingPreview'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            ETag:
              $ref: '#/components/headers/ShippingPreviewETag'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body was not a JSON object, carried a key this operation does
            not read, or carried a `shippingOptionId` that was not a non-empty
            string. The write's rule, applied here: a member you believed did
            something never silently does nothing, and a blank
            `shippingOptionId` is refused rather than read as an omission.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShippingNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/ShippingUpstreamConflict'
        '422':
          description: >
            The request was understood and refused **before the change was
            judged**. Two shapes, told apart by which member is present:
            `invalidParams` and no `code` is this service refusing your address
            locally, and names each offending member; a `code` is a refusal from
            the service behind this one. ⚠️ A refusal *of the change itself* is
            not here -- it arrives as `refusal` inside a `200`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AddressValidationProblemDetails'
                  - $ref: '#/components/schemas/ShippingProblemDetails'
        '502':
          $ref: '#/components/responses/ShippingPreviewBadGateway'
        '503':
          description: >
            Shipping changes are not available in this environment yet, so there
            is nothing to preview. Nothing is wrong with the order or the
            request, and no `Retry-After` is given because how long this lasts
            is not something this service knows. `GET /orders/{id}/shipping`
            still answers while this does not.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/fulfillment/account:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [account]
      summary: Account detail with addresses and billing
      operationId: getAccount
      description: >
        Never mints a payment launch token. See `POST
        /account/payment-method-actions` for minting a single-use "set card
        on file" launch URL.
      parameters:
        - name: expand
          in: query
          required: false
          description: >
            Opt-in expansion of expensive fields. Comma-separated list, or
            repeated `expand[]=` array. Tokens are case-sensitive; a token
            that is not listed below is rejected with `400`.


            Known tokens:

              * `paymentMethods` -- contact the payment provider and populate
                `financials.payment.methods` and `financials.payment.status`.
                Without this token (the default), `payment.status` is
                `not_requested` and `payment.methods` is `[]`. Use this only
                on screens that actually render saved cards (e.g. checkout)
                so that lighter-weight callers (account header, profile page)
                aren't paying the provider round-trip latency.
          schema:
            type: string
          example: paymentMethods
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
            Cache-Control:
              schema:
                type: string
              description: Always `private, max-age=30` -- this is a pure read and never mints.
              example: 'private, max-age=30'
        '400':
          description: >
            A query parameter other than `expand`, an `expand` value that is not
            valid UTF-8, or an `expand` token this operation does not know. All
            are refused rather than ignored.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

  /api/v1/fulfillment/account/payment-method-actions:
    post:
      x-whcc-writes: true
      tags: [account]
      summary: Mint a single-use "set card on file" launch token
      operationId: mintPaymentMethodAction
      description: >
        Mints a single-use RS256 launch token for the "set card on file"
        flow and returns it directly as the response body
        -- this used to be embedded at the account GET's
        `financials.payment.actions` location; it is now a dedicated POST
        because minting is a side-effecting create (it consumes a
        per-account/per-IP velocity slot and issues a live single-use
        credential), not a read. A GET can be retried transparently by
        clients/proxies/browsers; a POST here would silently burn velocity
        and mint stray live tokens on every retry, so this is intentionally
        not idempotent and callers should not blindly retry a failed
        request.


        **Scope gate:** the global `client`/`superadmin` scope
        gate (see the API-wide security scheme) still applies first,
        unchanged. On top of that, this operation additionally requires the
        `payment-methods:mint-launch-token` scope; missing it returns `403` (unlike the
        old GET expansion, which silently omitted the block -- this
        endpoint's entire purpose is minting, so there's nothing useful to
        return without the scope).


        **Velocity limits:** minting is rate limited per account and per
        IP; exceeding a limit returns `429`. Limit values are operationally
        configured and subject to change without notice. Shopper-level
        limiting keys on `client_ip` when it's present and a syntactically
        valid IP literal, else on the connection's own source IP.


        **Resolution rules** (unchanged from the retired GET query
        parameters): `return_to` is validated by exact origin (scheme+host)
        against a server-side allowlist; a disallowed or absent value falls
        back to a default URL for the account's brand (the brand's host
        root). `cancel_to` is validated against the same allowlist but has
        no default -- absent, disallowed, or malformed values simply omit
        the token's `cancel_to` claim (logged at warning) rather than
        failing the mint; the card page then falls back to the origin of
        `return_to`. `cart_id` is an opaque passthrough into the token's
        `return_context.cart_id` claim. `client_ip` -- the end shopper's own
        IP, forwarded by CWP (an authenticated first-party service field on
        a JSON body we already validate, a fundamentally different trust
        boundary than an untrusted edge `X-Forwarded-For` header) -- must be
        a syntactically valid IPv4/IPv6 literal (no CIDR ranges, no port, no
        bracketed IPv6); an absent or invalid value falls back to the
        source IP for the shopper velocity counter above (logged at
        warning) and never fails the mint.


        **Cache-Control:** every response this operation's own handler
        emits -- `200`, `400`, `403` (missing the `payment-methods:mint-launch-token`
        scope), `404`, `405`, `422`, `429`, `503` -- carries `Cache-Control:
        no-store, private`. That includes the `403` for an authenticated
        caller missing the global `client`/`superadmin` scope. Only a request
        with no authentication at all gets a generic `403` with plain
        `Cache-Control: no-store` instead (no `private`) -- no mint was
        attempted and no account-specific state was touched. An unhandled
        server error (`500`) is likewise plain `no-store`. Auth also runs
        before HTTP-method matching: an unauthenticated `GET` to this path
        returns `403`, not `405` -- a deliberate fail-closed ordering so an
        unauthenticated caller cannot use the `Allow` header to probe which
        methods a path supports.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodActionsRequest'
            examples:
              empty:
                summary: No body (or `{}`) -- all fields are optional
                value: {}
              full:
                summary: All fields supplied
                value:
                  return_to: 'https://www.whcc.com/checkout/resume'
                  cancel_to: 'https://www.whcc.com/checkout/cancel'
                  cart_id: cart_abc123
                  client_ip: '203.0.113.42'
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: >
            Mint succeeded. The body is exactly the object that used to be
            embedded at the account response's `financials.payment.actions`
            location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentActions'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
            Cache-Control:
              schema:
                type: string
              description: >
                Always `no-store, private` on every response of this
                operation, including errors -- a freshly minted single-use
                launch token (or the fact that a mint was attempted at all)
                must never be cached.
              example: 'no-store, private'
        '400':
          description: >
            Malformed request body: invalid JSON (including JSON nested
            deeper than 512 levels), a non-object top level, a present
            field holding a non-string non-null value, or a string field
            longer than 2048 characters. The body is fully caller-controlled
            JSON, so bad types/lengths are treated as a caller bug rather
            than coerced or truncated.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
          headers:
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
        '403':
          description: >
            Missing the `payment-methods:mint-launch-token` scope on an otherwise
            authenticated, in-global-scope caller (only returned by this
            operation's own scope gate). An unauthenticated caller never
            reaches this operation's routing and instead gets a generic `403`
            (documented at the API level) that carries plain `no-store`
            rather than `no-store, private`; a caller missing the global
            `client`/`superadmin` scope gets `no-store, private` -- see the
            Cache-Control note above.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
        '404':
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
        '405':
          description: >
            Wrong HTTP method for this path (`Allow` header lists `POST`).
            Only reachable for an authenticated, in-global-scope caller --
            see the Cache-Control note above for the auth-before-routing
            ordering that makes an unauthenticated wrong-method request a
            `403` instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Allow:
              schema:
                type: string
              example: POST
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
        '422':
          description: >
            The mint was refused for a reason that will NOT succeed on
            retry with the same inputs: missing/invalid billing address, or
            unrecognized brand. `code` is a stable machine-readable
            identifier (`mint_ineligible`); `detail` deliberately does not
            name which specific gate declined.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MintProblemDetails'
          headers:
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
        '429':
          description: Per-account or per-IP mint velocity limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the current fixed hourly velocity window rolls over.
              example: 1800
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MintProblemDetails'
        '503':
          description: >
            Infra failure in the mint path (signing-key secret fetch,
            velocity store error, unconfigured payments host/return_to
            default for the brand, JWT encode failure, or a missing source
            IP -- the API Gateway event carried none, which is an
            infrastructure fault, not an account eligibility problem).
            `code` is a stable machine-readable identifier
            (`mint_unavailable`); exception details are never exposed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MintProblemDetails'
          headers:
            Cache-Control:
              schema:
                type: string
              example: 'no-store, private'

  /api/v1/fulfillment/event-subscriptions:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [event-subscriptions]
      summary: List event subscriptions
      operationId: listEventSubscriptions
      description: >
        Every event subscription on the calling account. The account is taken
        from the credential; there is no way to list another account's
        subscriptions and no parameter that would name one.


        **`signingSecret` is never present on a read.** It is returned exactly
        once, by the create operation or by a rotation, and no other operation
        returns it.


        **This is the recovery path for a create you never saw the response to.**
        The subscription is written before the response is sent, so a create that
        times out may have succeeded. List your subscriptions to find it; its
        secret is unrecoverable, so delete it and create another.


        An account holding no subscriptions gets `200` with an empty `items`,
        never a `404`. There is no pagination: an account may hold at most 25
        subscriptions, so the collection fits in one response.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The account's event subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionListResponse'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Create an event subscription
      operationId: createEventSubscription
      description: >
        Registers a destination to receive order events for the calling account.


        **The subscription is created `disabled`.** Nothing is delivered to it
        until you enable it, so the usual sequence is create, then
        `POST /event-subscriptions/{id}/enable`.


        **`signingSecret` is shown once, in this response.** No operation but a
        rotation returns it again. If you lose this response you cannot recover
        the secret; the subscription can only be deleted and created again, or
        rotated for a fresh one -- unless you sent `Idempotency-Key`, in which
        case the identical retry hands you the same secret again. Without that
        header a create that times out is *state unknown* rather than failed --
        the subscription may exist, so retrying can leave you holding a second
        one whose secret you never saw.


        **The account is never in the request.** There is no body field that
        names an account, and a body carrying one is refused.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventSubscriptionRequest'
      responses:
        '201':
          description: >
            The subscription, with its signing secret. A repeat of this same
            request under the same `Idempotency-Key` answers with this same
            secret and the subscription's state **as it is when the repeat
            arrives** -- see that parameter for what a subscription changed or
            deleted in between answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEventSubscription'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body could not be read, or carries a field this resource does not
            have. A top-level `webhookVersion` is refused rather than ignored --
            the payload version is `destination.version` -- and so is any field
            naming an account.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          description: >
            Insufficient scope. Either the route's own gate -- a credential
            carrying none of `client`, `superadmin` or `apikey`, refused before
            any of the body is read and carrying **no** `code` -- or, with
            `code: insufficient_scope`, a body naming
            `destination.version: 1` on a credential without `apikey:oas`.
            The second refusal is asked once the version is known to be well
            formed and before any other field is validated, so a version outside
            `{1, 2}` is still `422 invalid_webhook_version`, and nothing is
            written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '409':
          description: >
            Two causes, told apart by `code`. `subscription_limit_reached` --
            this account already holds the maximum number of subscriptions,
            active or not (25); delete one, or ask WHCC to raise the limit.
            `idempotency_key_conflict` -- the `Idempotency-Key` you sent is
            already associated with a different request body, with a request
            that has not finished, or with a create whose subscription no
            longer exists; use a new key for a different request, or retry
            this exact one. If a repeat keeps answering this way for a
            request you believe succeeded, read
            `GET /api/v1/fulfillment/event-subscriptions`: the subscription
            may well be there, in which case the secret is not recoverable and
            the subscription should be deleted and created again under a new
            key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '422':
          description: >
            A value this service will not accept. Read `code`:
            `unsupported_destination_type`, `invalid_callback_uri`,
            `invalid_webhook_version`, `invalid_signing_secret`,
            `unknown_event_type`, `event_type_unavailable_for_version` or
            `incomplete_event_coverage`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '501':
          description: >
            **This version of the API does not answer it.** The response is
            retained, and not answered, because `webhook_version_unsupported` is
            in the published `code` list; `destination.version: 1` is accepted
            with `apikey:oas` and refused `403 insufficient_scope` without it.
            See the `403` response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/fulfillment/event-subscriptions/event-types:
    get:
