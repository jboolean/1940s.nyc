  /api/v1/fulfillment/event-subscriptions/{id}:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [event-subscriptions]
      summary: Read one event subscription
      operationId: getEventSubscription
      description: >
        One subscription on the calling account.


        **`signingSecret` is never present on a read.** It is returned exactly
        once, by the create operation or by a rotation, and no other operation
        returns it.


        An identifier that belongs to another account answers `404`, the same as
        one that does not exist: the two are deliberately indistinguishable, so
        this operation cannot be used to discover that a subscription exists.


        **The `ETag` is what a replace can be made against.** Send it back as
        `If-Match` on `PUT /event-subscriptions/{id}` and the replace is refused,
        rather than written over, if the subscription changed after this read.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          headers:
            ETag:
              $ref: '#/components/headers/EventSubscriptionETag'
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'
    put:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Replace an event subscription
      operationId: replaceEventSubscription
      description: >
        Replaces `destination`, `eventTypes` and `description` wholesale. `id`,
        `accountNo`, `status` and `signingSecret` are immutable and a body
        naming any of them is refused.


        **There is no partial update, and omitting a field does not preserve
        it.** Only `destination` is required. Every other field you leave out
        is reset to what a create would have given it, not carried over from
        the current resource:


        - `eventTypes` omitted becomes `["*"]` -- every event type, not the
          selection the subscription had.

        - `description` omitted becomes `null` -- the existing one is cleared.

        - `destination.version` is the one exception: omitted, it keeps the
          subscription's current version, because a replace may not change it.


        Read the current resource first and send back everything you mean to
        keep.


        **`destination.version` cannot change.** Omit it to keep the
        subscription's current version; send a different one and the request
        is refused, `422 destination_version_immutable`. Moving a subscriber
        between payload versions is not supported by this operation -- delete
        the subscription and create a new one with the version you want.


        **`acknowledgeIncompleteCoverage` is not carried over from the
        create.** It is request-scoped, so a body that still leaves coverage
        incomplete has to resupply it here.


        **A `suspended` subscription stays `suspended`.** This operation
        never sets `status`; a corrected `callbackUri` is not an implicit
        `POST .../enable`.


        **Send `If-Match` so a change made since your read is not overwritten.**
        Because this operation replaces the whole subscription, a body built
        from a read writes back that read's values for every field you did not
        mean to change -- including any somebody else changed in between.
        With the `ETag` from `GET /event-subscriptions/{id}` as `If-Match`, the
        replace is refused `412 etag_mismatch` instead, and nothing is written.
        The `ETag` is computed from the values of `destination`, `eventTypes`,
        `description` and `status`, so it moves when one of them is set to a
        different value -- by a replace, `enable` or `disable` -- and not for
        deliveries or a secret rotation; an `active` subscription's traffic
        does not stale it. A value changed and then changed back reads as
        unchanged, and nothing a replace writes differs from what you read.
        Without `If-Match` the replace is written whatever has changed.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - name: If-Match
          in: header
          required: false
          description: >
            The `ETag` from `GET /event-subscriptions/{id}`, or from a previous
            replace, unaltered. Opaque: do not parse, compare or construct one.
            `*` matches the subscription at whatever version it is; a
            comma-separated list matches when any member does. A weak
            validator (`W/"..."`) never matches.
          schema:
            type: string
          example: '"C2B556BFD059C263B72B8FDE28E8C4FF0B1A7261AD5866DF1C69EEC00481FABE"'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventSubscriptionRequest'
      responses:
        '200':
          description: The subscription, replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          headers:
            ETag:
              $ref: '#/components/headers/EventSubscriptionETag'
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body could not be read, or carries a field this operation
            does not have -- `id`, `accountNo` and `status` among them,
            exactly as on a create.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          description: >
            Insufficient scope. Either the route's own gate -- a credential
            carrying none of `client`, `superadmin` or `apikey` -- or,
            with `code: insufficient_scope`, a body naming
            `destination.version: 1` on a credential without `apikey:oas`.
            Reaching this second refusal requires the row to already store
            version 1, minted outside this API before it existed: no `PUT`
            body can introduce version 1 to a row that does not already carry
            it, because a disagreeing `version` is refused outright before any
            scope is checked -- see the `422` response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '412':
          description: >
            `etag_mismatch`: the subscription changed after the read your
            `If-Match` came from, or `If-Match` named no strong validator.
            Nothing was written. The body is checked first, so a request that
            is also invalid is answered `400`, `403` or `422` instead: fix the
            body before re-reading. Read `GET /event-subscriptions/{id}` again,
            decide against what you find, and send with the new `ETag` -- do
            not resend the same request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '422':
          description: >
            A value this service will not accept. Read `code`:
            `unsupported_destination_type`, `invalid_callback_uri`,
            `invalid_webhook_version`, `destination_version_immutable`,
            `unknown_event_type`, `event_type_unavailable_for_version` or
            `incomplete_event_coverage`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    delete:
      x-whcc-api-key: true
      x-whcc-writes: true
      x-whcc-irreversible: true
      tags: [event-subscriptions]
      summary: Delete an event subscription
      operationId: deleteEventSubscription
      description: >
        Removes the subscription permanently. Deliveries stop immediately and the
        signing secret is gone with the row; there is no undo and no archive.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '204':
          description: Deleted
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/fulfillment/event-subscriptions/{id}/deliveries:
    get:
      x-whcc-api-key: true
      x-whcc-writes: false
      tags: [event-subscriptions]
      summary: List delivery attempts for an event subscription
      operationId: listEventSubscriptionDeliveries
      description: >
        Every delivery WHCC attempted against this subscription, newest first --
        the self-service answer to "did you send it, and what did my endpoint
        say?".


        **Attempts, not deliveries.** A row exists for each POST WHCC made,
        whatever came back. A `500`, a timeout and a refused connection are all
        recorded, and are the rows this operation mostly exists to show.


        **`statusCode` is `null` when nothing answered.** A request that never
        reached you -- DNS failure, refused connection, TLS failure, a
        client-side timeout -- carries no status, and `reason` says which
        (`transport error` or `timeout`). A `503` in this field is a `503` your
        endpoint returned.


        **Pagination matches `GET /orders`**: both lists are newest-first,
        `before` walks into the past and `after` walks back toward the present,
        so one paginator reads either. Where this operation differs is that both
        cursors are published on any non-empty page, so the newest one can be
        replayed to poll for attempts that have happened since.


        **A cursor is resolved against this subscription's own attempts, and one
        that matches none of them returns an empty page rather than an error.**
        That covers a cursor from another subscription, a made-up one, and one
        naming an attempt that is no longer stored. So an empty page with
        `hasMore: false` does not by itself prove nothing is there -- a client
        that gets one from a long-held cursor restarts from the first page.


        An identifier that belongs to another account answers `404`, the same as
        one that does not exist. A subscription that exists but has never
        delivered answers `200` with an empty `items` array.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: before
          in: query
          required: false
          description: >
            Opaque cursor from a previous response's `pagination.nextBefore`.
            Returns attempts OLDER than that cursor -- the next page going back
            in time, the same sense `before` has on `GET /orders`. Mutually
            exclusive with `after`.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: >
            Opaque cursor from a previous response's `pagination.nextAfter`.
            Returns attempts NEWER than that cursor. Replay the `nextAfter` of
            your newest page to poll for attempts since. Mutually exclusive with
            `before`.
          schema:
            type: string
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: >
            One page of delivery attempts, newest first.


            **An empty page does not prove there is nothing there.** A cursor is
            resolved against this subscription's own attempts, and one matching
            none of them -- another subscription's, a made-up one, or one no
            longer stored -- returns `items: []` with `hasMore: false`, which is
            the same answer as "nothing further this way". A client whose
            long-held cursor goes quiet restarts from the first page rather than
            concluding the log is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter this operation does not accept, a value that is not
            valid UTF-8, a `limit` that is not an integer between 1 and 100, a
            cursor that is not well formed, or `before` and `after` together.


            **A well-formed cursor is not checked against the ones this
            operation issued.** It is resolved against this subscription's own
            attempts, so a cursor naming an attempt that is not one of them --
            another subscription's, a made-up one, or one no longer stored --
            selects nothing and the page comes back empty rather than `400`.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ReadTimedOut'

  /api/v1/fulfillment/event-subscriptions/{id}/enable:
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Enable an event subscription
      operationId: enableEventSubscription
      description: >
        Sets the subscription to `active`, so deliveries begin.


        **A state assertion rather than a transition**: enabling a subscription
        that is already `active` answers `200` with the resource, not a conflict.


        It is also the way back from `suspended`. Enabling clears the stop and
        resets the consecutive-failure count, so a subscription WHCC stopped for
        repeated failures does not re-suspend on its very next failure.


        An account may have at most 10 subscriptions `active` at once. Enabling
        one more is refused with `409 subscription_limit_reached`; `disabled`
        and `suspended` subscriptions do not count, so disabling one makes room.
        A subscription that is already `active` is never refused.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The subscription, now active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            `subscription_limit_reached` -- this account already has the
            maximum number of `active` subscriptions (10), and this one is not
            among them. Nothing is written. Disable or delete another, or ask
            WHCC to raise the limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'

  /api/v1/fulfillment/event-subscriptions/{id}/disable:
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Disable an event subscription
      operationId: disableEventSubscription
      description: >
        Sets the subscription to `disabled` with `statusDetail.reason: "user"`, so
        deliveries stop. A state assertion rather than a transition: disabling a
        subscription that is already stopped answers `200` with the resource.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The subscription, now disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            A query parameter was sent. This operation accepts none, and refuses
            one rather than ignoring it.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/fulfillment/event-subscriptions/{id}/rotate-secret:
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Rotate an event subscription's signing secret
      operationId: rotateEventSubscriptionSecret
      description: >
        Mints a fresh signing secret in place. The secret this replaces moves
        to a previous-secret slot and keeps signing deliveries for the overlap
        window `expiresIn` names -- during that window every delivery carries
        **two** `v1=` elements in its `WHCC-Signature` header, the fresh secret
        first and the previous one second, and you are verified if either one
        checks out. After the window closes only the fresh secret signs.


        **`signingSecret` is shown once, in this response.** No operation but
        a create or another rotation returns it again, and there is no read
        that recovers a lost one.


        **If you lose this response and did not send `Idempotency-Key`, the
        only way back is to rotate again once `previousSecretExpiresAt` has
        passed.** This service cannot tell "you never saw this" from "you are
        holding it already", so there is no other recovery -- rotating again
        discards a secret nobody can prove was ever read. Sending
        `Idempotency-Key` is what avoids the situation: the identical retry
        replays the exact secret this call minted, rather than forcing a
        second rotation to recover from one that might already have been
        seen.


        **A rotation while a previous one's window is still open is refused,
        `409 rotation_in_progress`.** Only one previous secret is kept at a
        time, so a second rotation before the first's window closes would
        discard a secret a delivery still being retried may have been signed
        with. Wait for `previousSecretExpiresAt`, which the `409` carries, and
        rotate again after it passes.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateEventSubscriptionSecretRequest'
      responses:
        '200':
          description: >
            The subscription, with its fresh signing secret. A repeat of this
            same request under the same `Idempotency-Key` answers with this
            same secret and the subscription's state **as it is when the
            repeat arrives** -- see that parameter for what a subscription
            changed in between answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEventSubscription'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body is not valid JSON, is not a JSON object, carries a field
            other than `expiresIn`, or `expiresIn` is present and neither
            `null` nor an integer. `code` is `malformed_request`.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventSubscriptionNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            Two causes, told apart by `code`. `rotation_in_progress` -- a
            previous rotation's overlap window is still open;
            `previousSecretExpiresAt` carries when it closes, and rotating
            again before then would discard a secret a delivery still being
            retried may have been signed with. `idempotency_key_conflict`
            -- the `Idempotency-Key` you sent is already associated with a
            different request body or with a rotation that has not finished;
            use a new key for a different request, or retry this exact one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '422':
          description: >
            `expiresIn` is an integer outside the bounds this service accepts.
            `code` is `invalid_expires_in`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'

  /api/v1/fulfillment/event-subscriptions/{id}/test:
    post:
      x-whcc-api-key: true
      x-whcc-writes: true
      tags: [event-subscriptions]
      summary: Fire a test event at an event subscription
      operationId: testEventSubscription
      description: >
        Queues one synthetic event for this account and returns immediately.


        **Two modes: your own order, or a synthetic one.** Send
        `confirmationId` and the event fires against that order of yours, so the
        webhook carries its real `ConfirmationId`, `EntryId`, `Reference` and
        order number -- which is what you want when you are checking that your
        receiver matches a delivery to an order in your own system. Omit it and
        the event fires against a synthetic order WHCC keeps for your account,
        created on first use and reused afterwards. Nothing is produced, priced
        or shipped in either case, and no order of yours is advanced.


        **Every subscription on the account receives it, not only `{id}`, and
        each one receives it whatever its status.** The `{id}` in the path
        identifies the subscription whose signing secret and `eventTypes` this
        request is checked against; it does not narrow who the event is
        delivered to. If your account holds more than one subscription, expect
        the event at all of them, and filter on the payload if you need to
        recognise it.


        **Nothing is sent while you wait, and the webhook you receive is
        byte-identical to a real one.** This does not build a special payload
        and POST it: it writes a notification into the same queue a real order
        writes to, and the ordinary delivery pipeline builds, signs and delivers
        it. So the body, the headers, the `WHCC-Signature` and the retry
        behaviour are the real ones, not an imitation of them -- there is no
        second implementation that could drift away from what your orders will
        actually produce.


        **It works whatever the subscription's status.** A subscription is
        created `disabled`, so this is how you check an endpoint *before*
        enabling it -- and how you re-check one after fixing it, without
        resuming real deliveries first.


        **Nothing has proven that `callbackUri` is yours.** No challenge is
        sent at registration and no verification step exists, so the only
        thing standing between a URL and a signed delivery to it is this
        request. Delivery refuses an endpoint that resolves to a private
        address. A test event is also delivered only to port `443` or
        `8443`, whether the URL names the port or `https` implies it: a URL
        on any other port, or an `http` URL, still gets this `202`, but the
        event is never sent, and no attempt for it appears in
        `GET /event-subscriptions/{id}/deliveries`. This can only arise for a
        subscription whose `callbackUri` predates the port rule on create and
        `PUT`. Real deliveries are not limited by port.
        Treat the URLs on your subscriptions with the care you give a
        credential: a mistyped host receives your events, and a test event is
        the fastest way to find that out.


        **It respects the subscription's own `eventTypes`.** Asking for a type
        this subscription has not selected is refused rather than delivered: a
        real one would not arrive either, and an event that ignored your filter
        would prove the wrong thing.


        **A test event is not counted toward auto-disable.** Diagnosing a broken
        endpoint cannot suspend your subscription, and a successful test cannot
        postpone a suspension either.


        **Delivery is asynchronous**, so this cannot tell you what your endpoint
        answered. Correlate with `notifyUid`, and observe the result at your own
        endpoint.


        **Rate limited** to 50 attempts per account and 150 per source address,
        per fixed clock-hour window. The window is fixed rather than rolling, so
        an allowance is restored at the top of the hour rather than an hour after
        each attempt -- and refused attempts are counted too, so a run of
        rejected requests consumes the allowance. `Retry-After` on a `429` carries
        the seconds until the window rolls over.
      parameters:
        - $ref: '#/components/parameters/EventSubscriptionId'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEventRequest'
      responses:
        '202':
          description: >
            The event was written and queued for a delivery attempt to every
            subscription on the account, whatever their status. Nothing has been
            attempted yet, and this is not a promise that any attempt will
            succeed -- the sender owns a retry ladder that can end in failure.
            Observe the result at your own endpoint.


            `subscriptionId` echoes the subscription named in the path, which is
            the one this request was validated against. It is not the only
            destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedTestEvent'
          headers:
            WHCC-API-Version:
              $ref: '#/components/headers/ApiVersion'
            WHCC-API-Version-Latest:
              $ref: '#/components/headers/ApiVersionLatest'
            WHCC-API-Version-Requested:
              $ref: '#/components/headers/ApiVersionRequested'
            Vary:
              $ref: '#/components/headers/Vary'
            x-response-time:
              $ref: '#/components/headers/ResponseTime'
        '400':
          description: >
            The body is missing, is not a JSON object, carries a field other than
            `eventType` or `confirmationId`, carries no `eventType`, or carries a
            `confirmationId` that is not a GUID. `code` is `malformed_request`.


            A query parameter is refused as well: this operation accepts none.


            Besides the above, a `WHCC-API-Version` naming a version this API does
            not serve is also answered `400`, before authentication and without
            version headers: `type`
            `https://developer.whcc.com/problems/unsupported-api-version`, and a
            `supportedVersions` member listing the months you may send.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EventSubscriptionProblemDetails'
                  - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            `subscription_not_found` where no subscription on your account has
            this identifier, or `confirmation_not_found` where the
            `confirmationId` you sent names no order on your account. Both cover
            "it does not exist" and "it belongs to someone else" with one answer,
            deliberately: two would let a caller enumerate other accounts'
            identifiers.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            The subscription cannot receive a test event in its current state.
            `code` is `no_signing_secret` where the subscription carries none --
            it would be delivered to with an empty `WHCC-Signature`, which you
            are told to treat as a verification failure -- or
            `shipped_dedup_pending` where a previous shipping test event for this
            account has not been delivered yet. Shipment notifications collapse
            per order per batch, so a second one written into that window would
            never arrive; retry shortly.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '422':
          description: >
            `eventType` names something this subscription cannot be sent.
            `unknown_event_type` where it is not an event type at all, or is one
            that cannot be fired (the refusal names the substitute);
            `event_type_unavailable_for_version` where the type exists but not at
            this subscription's `destination.version`; `event_type_not_selected`
            where the type exists at that version and this subscription's
            `eventTypes` does not include it;
            `event_type_unavailable_in_environment` where this deployment cannot
            fire the type at all, which today means `order.shipped` in
            production -- the synthetic shipment data it needs exists only in
            the dev and sandbox environments. That one is a property of the environment rather than of the
            subscription, so no change to `eventTypes` or `destination.version`
            clears it; the other event types are unaffected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'
        '429':
          description: >
            Too many test event attempts from this account or this address in
            the current fixed clock-hour window. Attempts are counted whether or
            not they were accepted. `Retry-After` carries the seconds until the
            window rolls over. `code` is `rate_limited`.
          headers:
            Retry-After:
              description: Seconds until the current window resets.
              schema:
                type: integer
              example: 1847
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionProblemDetails'

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by Prospector, validated by the design-editors-gateway Lambda authorizer.
        The token must include an accountId claim (whcc_{number}) and one of the required
        scopes: client, superadmin.

        Operations marked `x-whcc-api-key: true` also accept an API key or a WorkOS session
        token carrying the `apikey` scope, presented the same way. The scope is what admits
        the caller, not the kind of credential it came from.

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Order identifier. Accepts an order ID string or a numeric order number.

    EventSubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^SUB_[A-Za-z0-9]{14}$'
        example: 'SUB_7Kq2mZ1x9PdR4t'
      description: >
        Event subscription identifier: the literal prefix `SUB_` followed by
        fourteen letters or digits. Case-sensitive. An identifier of any other
        shape is not found.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        # ⚠️ `maxLength` counts CHARACTERS and the service counts BYTES
        # (`strlen`), so the two agree only while the value is single-byte.
        # The pattern is what makes that true: printable ASCII, no spaces.
        # Without it a 200-character multibyte key satisfies this schema and
        # is still refused `400`.
        maxLength: 255
        minLength: 1
        pattern: '^[\x21-\x7E]{1,255}$'
      description: >
        Make this request safe to retry. Repeat the same key with the exact
        same body and the operation is not run a second time: you are handed
        back what it produced, including the signing secret a create or a
        rotation shows exactly once. Repeat the same key with a different body
        and the request is refused, `409 idempotency_key_conflict`, before
        anything is written; use a new key for a different request. Omit the
        header and every call is independent, as it was before this header
        existed.


        **What is replayed is the secret, not a frozen copy of the response.**
        The resource travels with the repeat as it stands at that moment, so a
        subscription you have since changed with
        `PUT /api/v1/fulfillment/event-subscriptions/{id}` replays with the
        secret it was issued alongside its *updated* fields. A subscription
        you have since deleted is not recreated, and a rotation on one is not
        repeated: the repeat is refused `409 idempotency_key_conflict`,
        because minting a second subscription, or rotating a secret, under a
        key that has already answered once would be the duplicate this header
        exists to prevent.


        **A create's key and a rotation's key on the same subscription never
        collide.** Each operation claims its own namespace, so replaying one
        never answers with the other's secret.


        **Retention differs by operation.** A create's key is kept for 7 days,
        a rotation's for 6. A retry arriving after its key's retention has
        passed is answered as a fresh request rather than replayed.


        **A replay never hands back a retired secret.** Rotating moves a
        subscription's signing secret on, so a key claimed before a rotation
        stores one the subscription may no longer sign with. Such a key is
        refused `409 idempotency_key_conflict` rather than replayed — a
        secret you could install and find nothing verified by it is the worse
        of the two answers. This applies to a create's key as much as a
        rotation's.

    ApiVersion:
      name: WHCC-API-Version
      in: header
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        example: '2026-10'
      description: >
        The API version to answer as: a month, such as `2026-10`. Omit the
        header and you are served the account's default version, currently
        `2026-10`. Any value other than a supported month -- an unsupported
        month, a month in the wrong form, an empty value -- is refused `400`
        before anything else is decided, with `type`
        `https://developer.whcc.com/problems/unsupported-api-version` and a
        `supportedVersions` member listing the months you may send. The
        refusal is the same whether or not the request is authenticated.


        Every answer to a request served a version says which one in
        `WHCC-API-Version`, the newest in `WHCC-API-Version-Latest`, and, when
        you sent the header, what you sent in `WHCC-API-Version-Requested`. The
        refusal carries none of them.

  headers:
    EventSubscriptionETag:
      description: >
        Opaque validator for the subscription in this response. Send it back
        unaltered as `If-Match` on `PUT /event-subscriptions/{id}` to have the
        replace refused rather than written if the subscription's
        configuration differs from what you read. It is computed from the
        values of `destination`, `eventTypes`, `description` and `status`, and
        from nothing else: `modifiedAt` and `lastDeliveryError` can change
        while it stays the same, so deliveries and secret rotations leave it
        as it was. Absent on the rare response that
        could not read one; the
        subscription is still complete, but a replace sending `If-Match`
        cannot be made against that read.
      schema:
        type: string
        example: '"C2B556BFD059C263B72B8FDE28E8C4FF0B1A7261AD5866DF1C69EEC00481FABE"'

    ShippingETag:
      description: >
        Opaque validator for the shipping state in this response. Send it back
        unaltered as `If-Match` when changing the order's shipping. Absent on
        the rare response the upstream store issued none for; the state is
        still complete, but a change cannot be made against that read.
      schema:
        type: string
        example: 'W/"7c9a1f-2026-09-06"'

    ShippingPreviewETag:
      description: >
        The order's **current** validator -- the same one `GET
        /orders/{id}/shipping` hands out, and not one the previewed change would
        produce. This operation reads no `If-Match` and moves no validator;
        this is here so you can send it as the write's `If-Match` and write
        exactly what you previewed. Absent on the rare response the upstream
        store issued none for.
      schema:
        type: string
        example: 'W/"7c9a1f-2026-09-06"'

    ResponseTime:
      schema:
        type: string
        example: '12.34ms'
      description: Server-side response time

    RetryAfter:
      schema:
        type: integer
        minimum: 1
        example: 5
      description: Seconds to wait before sending the same request again.

    ApiVersion:
      description: >
        The version this answer was served as: the month you requested, or the
        account's default when you sent no `WHCC-API-Version`. Absent on the
        `400` that refuses an unsupported version.
      schema:
        type: string
        example: '2026-10'

    ApiVersionLatest:
      description: >
        The newest version the API serves, whatever version this answer was
        served as. Compare it with `WHCC-API-Version` to learn whether a newer
        one exists.
      schema:
        type: string
        example: '2026-10'

    ApiVersionRequested:
      description: >
        The `WHCC-API-Version` you sent, echoed back. Sent only when the
        request carried the header, so its presence says you asked for a
        version rather than defaulted to one.
      schema:
        type: string
        example: '2026-10'

    Vary:
      description: >
        Names `WHCC-API-Version`, because the version you send selects the
        version that answers. Any other header an answer varies on is listed
        alongside it.
      schema:
        type: string
        example: 'WHCC-API-Version'

  schemas:
    OrderListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchScope:
          $ref: '#/components/schemas/OrderSearchScope'

    OrderSearchScope:
      type: object
      description: |
        Which orders a `search` matched by reference. Present only when the
        request sent `search`. Each page reports its own coverage, so as new
        orders arrive, a `recent` search's `oldestSearched` can move to a newer
        order between pages. It describes the reference match alone: an order
        number is matched across every order whatever the scope.
      required: [scope, complete, orderLimit, oldestSearched]
      properties:
        scope:
          type: string
          enum: [recent, all]
          description: The `searchScope` the search ran with.
          example: recent
        complete:
          type: boolean
          description: |
            True when the reference match covered every order on your account:
            always for `all`, and for `recent` when the account has no more
            orders than `orderLimit`. When false, `searchScope=all` can find
            references this search did not reach.
          example: false
        orderLimit:
          type: integer
          nullable: true
          description: How many of your newest orders a `recent` search covers. Null for `all`.
          example: 50000
        oldestSearched:
          type: object
          nullable: true
          description: |
            The oldest order the reference match covered. Null when `complete`
            is true, or when none of the orders it covered is on your order list.
          required: [orderNumber, createdAt]
          properties:
            orderNumber:
              type: string
              example: '22478746'
            createdAt:
              type: string
              format: date-time
              description: When the order was received, as `createdAt` on an order summary.
              example: '2026-06-16T20:09:17.000-05:00'

    Pagination:
      type: object
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
          description: Requested page size
          example: 25
        hasMore:
          type: boolean
          description: Whether more results exist beyond this page
          example: true
        nextBefore:
          type: string
          nullable: true
          description: Opaque cursor token. Pass as `?before=` to fetch the next page of older orders. Null when no older orders follow this page, and always null on a page fetched with `after`.
          example: OTAwMDAwMDE
        nextAfter:
          type: string
          nullable: true
          description: Opaque cursor token. Pass as `?after=` to fetch the next page of newer orders. Null when no newer orders precede this page, and always null on a page fetched with `before` or with none of `before`, `after` and `startAt`.

    OrderConfiguredProductsResponse:
      type: object
      description: Configured product IDs associated with a single order.
      required: [items]
      properties:
        items:
          type: array
          description: >
            Each configured product once, in the order the order's items were
            recorded. An order summary's `configuredProducts` is always the
            start of this list.
          items:
            $ref: '#/components/schemas/ConfiguredProduct'

    OrderConfiguredProductsSearchResponse:
      type: object
      description: Fulfillment orders matching a source order, each with associated configured product IDs.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderConfiguredProductGroup'

    OrderConfiguredProductGroup:
      type: object
      required: [orderId, orderNumber, sourceOrder, configuredProducts]
      properties:
        orderId:
          type: string
          description: Order ID when available, otherwise the numeric order number as a string
          example: FO_Xt7mK9pR2wQ4nYd
        orderNumber:
          type: string
          description: Numeric WHCC order number
          example: '90000003'
        sourceOrder:
          $ref: '#/components/schemas/SourceOrderReference'
        configuredProducts:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguredProduct'

    SourceOrderReference:
      type: object
      required: [id, orderIndex, duplicateIndex]
      properties:
        id:
          type: string
          description: Source order identifier
          example: Q4SWdKQhLgLTxQFNE
        orderIndex:
          type: integer
          description: Position of this fulfillment order within the source order
          example: 1
        duplicateIndex:
          type: integer
          nullable: true
          description: Duplicate item index when present, otherwise null
          example: null

    ConfiguredProduct:
      type: object
      required: [configuredProductId]
      properties:
        configuredProductId:
          type: string
          description: Identifier that maps to Prospector Basic Order items[].configuredProductId
          example: CF_ddTYzrTfjEebOMNAPb5CPbn6RQ0D4hJu8OjT0rIKS7Hc6cH

    OrderEntry:
      type: object
      description: |
        The Order Submit API entry an order was imported in, with the
        identifiers that API returned and you sent. One entry can produce
        several orders: they share `confirmationId` and `entryId`, and differ
        by `sequenceNumber`.

        Every order imported from an entry of yours has an `entry`, whichever
        way it was submitted.
        An order submitted through Prospector also has a `sourceOrder`, which
        is the Prospector submission it came from; Prospector imports one entry
        per order, so group Prospector orders by `sourceOrder`, not `entry`.
      required: [confirmationId, entryId, sequenceNumber]
      properties:
        confirmationId:
          type: string
          format: uuid
          description: >
            The `ConfirmationID` the entry was given, in lowercase.
            Compare it without regard to case. Filter the list on it with
            `entryConfirmationId`.
          example: f27c9d34-c2ce-4685-b667-25c99fb4855f
        entryId:
          type: string
          nullable: true
          description: >
            The `EntryID` the entry was imported under, as you sent it. Not
            unique: a resubmission can reuse one. Null where the entry carried
            none.
          example: '5003627682'
        sequenceNumber:
          type: string
          description: >
            This order's `SequenceNumber` within its entry, as you sent it.
            Text, not a number: compare it as a string.
          example: '3'

    OrderSummary:
      type: object
      required:
        [
          id,
          orderNumber,
          sourceOrder,
          entry,
          createdAt,
          productType,
          status,
          progress,
          statusAt,
          deliveryLocation,
          configuredProductCount,
          configuredProducts,
          links,
        ]
      properties:
        id:
          type: string
          description: Order ID when available, otherwise the numeric order number as a string
          example: FO_Xt7mK9pR2wQ4nYd
        orderNumber:
          type: string
          description: Numeric WHCC order number
          example: '90000001'
        sourceOrder:
          nullable: true
          description: >
            The Prospector submission this order was split from, as on the
            order's detail: Prospector's `submission.id` is its `id`. Null when
            the order did not come from one. For the Order Submit API entry
            behind the order, whatever its channel, read `entry`.
          allOf:
            - $ref: '#/components/schemas/SourceOrderReference'
        entry:
          nullable: true
          description: >
            The Order Submit API entry this order was imported in, as on the
            order's detail. Null when no entry of yours is behind the order:
            a charge added to your account by hand, or a reprint WHCC made of
            an order you placed through Prospector, which carries that order's
            `sourceOrder`.
          allOf:
            - $ref: '#/components/schemas/OrderEntry'
        createdAt:
          type: string
          description: Timestamp from received_at
          example: '2026-02-15T14:22:08.483-06:00'
        productType:
          type: string
          description: >
            Product category. Known values include: Loose Prints, Book, Canvas Wrap,
            Metal Print, Acrylic Print, Image Box, Press Cards, Albums, and others.
            New values may be added without a version change.
          example: Book
        reference:
          type: string
          nullable: true
          description: Empty strings are normalized to null
          example: 'SR 1000001-TnVsbFJlZg'
        status:
          type: string
          description: Defaults to "Order Received" when no tracking data exists yet
          example: In Production
        progress:
          $ref: '#/components/schemas/OrderStatusProgress'
        statusAt:
          type: string
          description: Timestamp of the status with timezone. Defaults to createdAt when no tracking data exists yet.
          example: '2026-02-16T06:21:43.223-06:00'
        deliveryLocation:
          $ref: '#/components/schemas/OrderDeliveryLocation'
        configuredProductCount:
          type: integer
          minimum: 0
          description: >
            Number of distinct configured products on the order, regardless of
            the quantity ordered of each. 0 when the order carries none.
          example: 12
        configuredProducts:
          type: array
          maxItems: 3
          description: >
            The order's first configured products, at most three, in the order
            its items were recorded. Always the start of the list
            `GET /api/v1/fulfillment/orders/{id}/configured-products` returns,
            which is where the rest are. Empty when `configuredProductCount`
            is 0.
          items:
            $ref: '#/components/schemas/ConfiguredProduct'
        links:
          $ref: '#/components/schemas/OrderSummaryLinks'

    OrderSummaryLinks:
      type: object
      required: [self, tracking, entry]
      properties:
        self:
          type: string
          description: Relative URL to the order detail endpoint
          example: /api/v1/fulfillment/orders/FO_Xt7mK9pR2wQ4nYd
        tracking:
          type: string
          format: uri
          nullable: true
          description: Combined shipping tracking URL. Null when no shipments exist yet.
          example: 'https://www.fedex.com/fedextrack/?trknbr=794644790128'
        entry:
          type: string
          nullable: true
          description: >
            Relative URL to the order list narrowed to this order's entry:
            every order the entry produced, this one included. Null when `entry`
            is null.
          example: /api/v1/fulfillment/orders?entryConfirmationId=f27c9d34-c2ce-4685-b667-25c99fb4855f

    Order:
      type: object
      description: >
        Full order detail. A superset of OrderSummary, except for
        `configuredProductCount` and `configuredProducts`, which only the list
        carries:
        `GET /api/v1/fulfillment/orders/{id}/configured-products` gives the
        whole set for one order.
      required:
        [
          id,
          orderNumber,
          entry,
          createdAt,
          productType,
          lifecycle,
          status,
          progress,
          statusAt,
          shippingFrom,
          deliveryLocation,
          cancelEligibility,
          links,
          financials,
          statusHistory,
          shipments,
        ]
      properties:
        id:
          type: string
          description: Order ID when available, otherwise the numeric order number as a string
          example: FO_Xt7mK9pR2wQ4nYd
        orderNumber:
          type: string
          description: Numeric WHCC order number
          example: '90000003'
        sourceOrder:
          nullable: true
          description: >
            The Prospector submission this order was split from: Prospector's
            `submission.id` is its `id`. Null when the order did not come from
            one. For the Order Submit API entry behind the order, whatever its
            channel, read `entry`.
          allOf:
            - $ref: '#/components/schemas/SourceOrderReference'
        entry:
          nullable: true
          description: >
            The Order Submit API entry this order was imported in. Null when no
            entry of yours is behind the order: a charge added to your account
            by hand, or a reprint WHCC made of an order you placed through
            Prospector, which carries that order's `sourceOrder`.
          allOf:
            - $ref: '#/components/schemas/OrderEntry'
        createdAt:
          type: string
          description: Timestamp from received_at
          example: '2026-02-06T13:38:34.348-06:00'
        productType:
          type: string
          description: >
            Product category. Known values include: Loose Prints, Book, Canvas Wrap,
            Metal Print, Acrylic Print, Image Box, Press Cards, Albums, and others.
            New values may be added without a version change.
          example: Image Box
        reference:
          type: string
          nullable: true
          description: Empty strings are normalized to null
          example: 'PS 1000002-TnVsbFJlZg'
        lifecycle:
          deprecated: true
          description: >
            Deprecated -- use `progress.billing` instead, which carries the
            same value. Still emitted, unchanged; it will be removed in a
            future major version.
          allOf:
            - $ref: '#/components/schemas/OrderLifecycle'
        status:
          type: string
          description: Most recent status from statusHistory, provided at the top level for convenience.
          example: Shipped
        progress:
          $ref: '#/components/schemas/OrderProgress'
        statusAt:
          type: string
          description: Timestamp of the most recent status from statusHistory, provided at the top level for convenience.
          example: '2026-02-10T11:10:49.907-06:00'
        estimatedCompleteDate:
          type: string
          format: date
          nullable: true
          description: The requested ship date recorded on the order's sales document in the accounting system. Null when there is none.
          example: '2026-02-12'
        cancelEligibility:
          $ref: '#/components/schemas/CancelEligibility'
        shippingFrom:
          type: string
          description: WHCC production city
          example: Waukesha
        shippingMethod:
          type: string
          nullable: true
          description: >
            How the order is set to be handed over, in a name a person can
            read -- the carrier method for an order that will be carried, and
            "Pick Up" for an order that asked to be collected. It is set well
            before anything ships, so an order that has shipped nothing can
            still carry one; it is null when the order names a method there is
            no readable name for.


            Read `deliveryLocation` rather than matching on this string. This
            one is display copy and may be reworded; that one is a fixed value
            to branch on.


            It is not the shipping option the order requested and is billed
            for. The two are separate facts and are permitted to differ by
            design, so neither is a stale copy of the other -- read
            `GET /orders/{id}/shipping` for what was requested. That resource
            is also the only source of an `If-Match` validator: this response
            is cacheable for 30 seconds, so a validator taken from here would
            be one that was fresh when the cache filled and stale when it
            fires.
          example: FedEx Ground
        deliveryLocation:
          $ref: '#/components/schemas/OrderDeliveryLocation'
        links:
          $ref: '#/components/schemas/OrderDetailLinks'
        financials:
          $ref: '#/components/schemas/OrderFinancials'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/OrderTracking'
        # ⚠️ Do not document what an empty `shipments` implies about a write.
        # The correspondence is real -- an order with no shipment record is
        # exactly the population a shipping change applies to -- and stating it
        # would mint the derived eligibility hint ENG-4394 ruled out, wearing an
        # array's emptiness instead of a boolean's name. Order detail says what
        # its members are; `GET /orders/{id}/shipping` is the authority on what
        # can be written. See docs/adr/0003-upstream-shipping-refusals-relay-verbatim.md.
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/OrderShipment'

    OrderDetailLinks:
      type: object
      description: Superset of OrderSummaryLinks.
      required:
        [self, tracking, invoice, cartSummary, cancelActions, shipping, entry]
      properties:
        self:
          type: string
          description: Relative URL to the order detail endpoint
          example: /api/v1/fulfillment/orders/FO_Bv3jL8sN5xW6hZf
        shipping:
          type: string
          description: >
            Relative URL to this order's shipping state -- where the parcel is
            going and which shipping option it holds. Always present. Unlike
            `cancelActions` it is never `null`: there is no *order* whose
            shipping state that resource would refuse to read.


            The link asserts nothing about whether the order's shipping can be
            *changed*. Follow it and read the state to learn that.


            The resource behind this link accepts the same credentials this
            one does, including an API key carrying `apikey` -- all three
            shipping operations were opened together (ENG-4414). Following it
            with the key that read this document needs no second credential.
          example: /api/v1/fulfillment/orders/FO_Bv3jL8sN5xW6hZf/shipping
        cancelActions:
          type: string
          nullable: true
          description: >
            Relative URL of the endpoint that mints a cancel token for this
            order. The key is always present and is `null` exactly when
            `cancelEligibility.eligible` is false -- the two are the same answer
            in two encodings and cannot disagree.


            A link, not a credential: it is safe in this cacheable response
            because the token itself is only ever minted by the POST behind it,
            whose responses are `no-store`.
          example: /api/v1/fulfillment/orders/FO_Bv3jL8sN5xW6hZf/cancel-actions
        tracking:
          type: string
          format: uri
          nullable: true
          description: Combined shipping tracking URL. Null when no shipments exist yet.
          example: 'https://www.fedex.com/fedextrack/?trknbr=794644790128'
        invoice:
          type: string
          format: uri
          nullable: true
          description: >-
            Invoice document URL. Present only once the order's billing has
            settled -- `progress.billing` is `complete`, meaning the financial
            hold has been released or the document has posted to accounting
            history. Null before then, and null for a canceled order.
          example: 'https://www.whcc.com/account/docs/request/invoice/90000003/a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6'
        cartSummary:
          type: string
          format: uri
          nullable: true
          description: Cart summary URL. Null when not available.
          example: 'https://www.whcc.com/account/order/Xk9mT4rB2nQ7wYp3H'
        entry:
          type: string
          nullable: true
          description: >
            Relative URL to the order list narrowed to this order's entry:
            every order the entry produced, this one included. Null when `entry`
            is null.
          example: /api/v1/fulfillment/orders?entryConfirmationId=f27c9d34-c2ce-4685-b667-25c99fb4855f

    OrderFinancials:
      type: object
      description: >
        What this order costs and whether it has been invoiced.


        This object carries each amount twice while a convergence is under way.
        `amounts` is the shape used everywhere else in this document, including
        the shipping resources; the decimal string beside a sibling `currency`
        is the older shape and is deprecated. The two are always the same
        amount -- read `amounts` in new code, and expect the deprecated members
        to be removed in a future major version.
      required:
        [currency, subtotal, tax, discount, total, invoiced, items, amounts]
      properties:
        amounts:
          type: object
          description: >
            This order's amounts. Prefer these over the deprecated decimal
            strings alongside them: each carries its own currency code, so
            there is no separate `currency` member to read.
          required: [subtotal, tax, discount, total]
          properties:
            subtotal:
              $ref: '#/components/schemas/Money'
            tax:
              $ref: '#/components/schemas/Money'
            discount:
              $ref: '#/components/schemas/Money'
            total:
              $ref: '#/components/schemas/Money'
        currency:
          type: string
          deprecated: true
          description: >
            Deprecated -- the currency is carried on each amount in
            `financials.amounts`, so there is nothing this member says that
            those do not. ISO 4217 currency code. Still emitted, unchanged;
            it will be removed in a future major version.
          example: USD
        subtotal:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `financials.amounts.subtotal` instead.
            Formatted decimal, e.g. "50.00". Still emitted, unchanged; it will
            be removed in a future major version.
          example: '135.80'
        tax:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `financials.amounts.tax` instead. Formatted
            decimal. Still emitted, unchanged; it will be removed in a future
            major version.
          example: '0.00'
        discount:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `financials.amounts.discount` instead. Formatted
            decimal. Still emitted, unchanged; it will be removed in a future
            major version.
          example: '0.00'
        total:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `financials.amounts.total` instead. Formatted
            decimal. Still emitted, unchanged; it will be removed in a future
            major version.
          example: '135.80'
        invoiced:
          type: boolean
          example: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingLineItem'

    OrderLifecycle:
      type: string
      enum: [pending, processing, complete, canceled]
      description: |
        Where the order's sales document in the accounting system stands.
        - pending: No sales document exists for the order in the accounting
          system yet.
        - processing: A sales document exists and is open -- not voided and
          not yet settled.
        - complete: The sales document is settled. Either it has been posted,
          which counts as invoiced outright, or it is still open with every
          hold on it released. One outstanding hold keeps it out of
          `complete`, and an open document with no hold recorded on it at
          all is `processing`, not `complete`.
        - canceled: The sales document has been voided.

        This describes the sales document and nothing else. It does not say
        whether the account has paid -- no payment or receivable is read --
        and it does not say whether anything has been produced or has left
        the building; `progress.fulfillment` says that.

    OrderStatusProgress:
      type: object
      description: >
        How far fulfilment has got, as the order list and each `statusHistory`
        entry carry it. The same object, at the same path, as `progress` on
        `GET /orders/{id}`, less `billing`: these payloads do not report
        billing, so the member is absent rather than null. Read it from the
        order detail. An absent `billing` says this payload does not carry
        billing; it is unrelated to a `fulfillment` of `none`, which says the
        status was classified and has no fulfilment.
      required: [fulfillment]
      properties:
        fulfillment:
          $ref: '#/components/schemas/OrderFulfillmentProgress'

    OrderProgress:
      description: >
        The two lifecycles of an order: how far fulfilment has got, and where
        its billing stands. They almost always agree, and are separate members
        because where they differ each is a fact worth keeping -- a payment
        problem can halt production, and a credit can change billing without
        fulfilment moving.


        Where the two lifecycles share a concept they share a word, and where
        they diverge the words diverge. `pending` means that lifecycle has not
        started and `canceled` means it was cancelled, in either member; every
        other value belongs to one member only, because being produced and
        being invoiced are not the same activity.
      allOf:
        - $ref: '#/components/schemas/OrderStatusProgress'
        - type: object
          required: [billing]
          properties:
            billing:
              $ref: '#/components/schemas/OrderBillingProgress'

    OrderFulfillmentProgress:
      type: string
      enum:
        [
          pending,
          in_progress,
          produced,
          ready_for_collection,
          fulfilled,
          blocked,
          cancel_requested,
          canceled,
          none,
          unknown,
        ]
      description: |
        How far fulfilment of the order has got -- making it and handing it
        over -- as a fixed vocabulary safe to branch on. It classifies the
        `status` beside it and never replaces it: new status values appear
        without a version change, and this is how a client handles one it
        does not recognise.
        - pending: Accepted and waiting to be produced.
        - in_progress: Being printed, finished or packed.
        - produced: Produced and packed. On a pickup order it can come before
          `ready_for_collection`, or without it, so it does not mean the order
          can be collected.
        - ready_for_collection: Ready to be collected in person.
        - fulfilled: Left the building, handed to a carrier or collected in
          person. It is not a delivery confirmation.
        - blocked: Halted until something is resolved. The `status` beside
          it says what.
        - cancel_requested: A cancellation has been requested and is not yet
          final.
        - canceled: The order has been canceled.
        - none: No fulfilment applies to this record, such as an applied
          credit or discount on a remake that is never produced. It says
          nothing about money; `progress.billing` does.
        - unknown: The status beside it is one this vocabulary does not yet
          classify. Every current status classifies, so this appears only
          when a new status is introduced, and it is never an error.

        On an order, this is the progress of the latest status, never the
        furthest step the order has reached. Production can move backwards --
        an order ready to leave can return to production -- so a client
        drawing progress redraws from the current value and does not keep a
        step it once saw finished. Each `statusHistory` entry carries the
        progress of that entry alone.

        Always present and never null. Whether the order is collected or
        shipped is `deliveryLocation`, not this. No label or ordering is
        included, so each client supplies its own wording.

    OrderBillingProgress:
      type: string
      enum: [pending, processing, complete, canceled]
      description: |
        Where the order's sales document in the accounting system stands, as
        a fixed vocabulary safe to branch on. The same values the deprecated
        `lifecycle` carries.
        - pending: No sales document exists for the order in the accounting
          system yet.
        - processing: A sales document exists and is open -- not voided and
          not yet settled.
        - complete: The sales document is settled. Either it has been posted,
          which counts as invoiced outright, or it is still open with every
          hold on it released. One outstanding hold keeps it out of
          `complete`, and an open document with no hold recorded on it at
          all is `processing`, not `complete`.
        - canceled: The sales document has been voided.

        This describes the sales document and nothing else. It does not say
        whether the account has paid -- no payment or receivable is read --
        and it does not say whether anything has been produced or has left
        the building; `progress.fulfillment` says that.

    OrderDeliveryLocation:
      type: string
      enum: [pickup, account, dropship]
      description: |
        Where the order asked to end up, as a fixed vocabulary safe to branch
        on.
        - pickup: Collected in person at the production location.
        - account: Sent to the account holder.
        - dropship: Sent on to the account holder's own customer.

        This is what the order requested, not a statement about what happens
        to it. A pickup order can still carry tracking, shipments and a shipped
        status, so a client that hides any of those on the strength of `pickup`
        will contradict the order detail's `shipments`. Read `shipments` on
        `GET /orders/{id}` for what became of the order; the list carries no
        shipment member of its own.

        Always present and never null, and every order is one of these
        values.

    CancelEligibility:
      type: object
      description: >
        Whether this order is eligible for cancellation, and when it is not, why.
        This is the same answer the cancellation request enforces, so it is not
        merely advisory.
      required: [eligible, reason, status, ineligibleAt]
      properties:
        eligible:
          type: boolean
          description: True if the order can still be canceled.
          example: false
        reason:
          allOf:
            - $ref: '#/components/schemas/CancelIneligibilityReason'
          nullable: true
          description: Why the order cannot be canceled. Null when eligible is true.
        status:
          type: string
          nullable: true
          description: >
            The order status that put the order past the point of cancellation.
            Present only when reason is order_completed; null for every other
            reason and when eligible is true.
          example: Premium Packaging
        ineligibleAt:
          type: string
          nullable: true
          description: >
            When the order became ineligible - when it was canceled, when the
            cancellation was requested, or when it reached the status named in
            `status`. Null when eligible is true, and null for
            not_a_cancelable_kind and order_not_found, which have no such
            moment.
          example: '2026-02-07T06:23:27.393-06:00'

    CancelIneligibilityReason:
      type: string
      description: |
        Why an order may not be canceled. At most one reason is reported, and an
        order that is already canceled says so rather than reporting how far
        production got. Modeled as an open string (deliberately not an `enum`)
        so new reasons can be introduced without a breaking schema change;
        clients should treat any unknown value as a generic refusal.

        - order_not_found: no order with this identifier belongs to the caller.
        - already_canceled: the order has already been canceled.
        - cancellation_already_requested: a cancellation has already been asked for.
        - not_a_cancelable_kind: remakes cannot be canceled here.
        - order_completed: the order reached a point past which it can no longer be canceled; see `status` and `ineligibleAt`.
      example: order_completed

    BillingLineItem:
      type: object
      description: >
        One billed line of an order.


        As with `financials` itself, each amount is carried twice while a
        convergence is under way: `amounts` is the shape used everywhere else
        in this document, and the decimal strings beside it are deprecated. The
        currency is the order's, and is on each `amounts` member.
      required: [sku, description, quantity, price, total, amounts]
      properties:
        sku:
          type: string
          example: '1048210'
        description:
          type: string
          example: 10x10 Image Box
        quantity:
          type: integer
          example: 1
        amounts:
          type: object
          description: >
            This line's unit price and line total. Prefer these over the
            deprecated decimal strings alongside them.
          required: [price, total]
          properties:
            price:
              $ref: '#/components/schemas/Money'
            total:
              $ref: '#/components/schemas/Money'
        price:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `amounts.price` instead. Unit price, formatted
            decimal, e.g. "0.50". Still emitted, unchanged; it will be removed
            in a future major version.
          example: '135.80'
        total:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `amounts.total` instead. Line total
            (quantity x price), formatted decimal, e.g. "5.00". Still emitted,
            unchanged; it will be removed in a future major version.
          example: '135.80'

    OrderTracking:
      type: object
      required: [occurredAt, status, progress]
      properties:
        occurredAt:
          type: string
          description: When the order entered this status
          example: '2026-02-07T06:23:27.393-06:00'
        status:
          type: string
          example: In Production
        progress:
          $ref: '#/components/schemas/OrderStatusProgress'
        lastConfirmedAt:
          type: string
          nullable: true
          description: Last time this status was re-recorded, or null if it only occurred once
          example: '2026-02-07T17:45:12.110-06:00'

    OrderShipment:
      type: object
      required: [carrier, address]
      properties:
        carrier:
          type: string
          example: FedEx
        shippingMethod:
          type: string
          nullable: true
          description: >
            The service this shipment was actually bought on, off the record
            written when its label was bought. It says what happened rather
            than what was asked for and is never rewritten, so it is not the
            order's requested shipping option and need not match the order's
            own carrier method.
          example: FedEx Ground
        trackingNumber:
          type: string
          nullable: true
          description: Raw tracking number
          example: '794644790128'
        trackingUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://www.fedex.com/fedextrack/?trknbr=794644790128'
        weight:
          type: number
          format: float
          nullable: true
          example: 5.2
        address:
          description: >
            Where this shipment went, as recorded when its label was bought.
            Provenance rather than intent: it is never rewritten afterwards,
            so it can differ from where the order is currently addressed.
            `GET /orders/{id}/shipping` is the authority on that.
          allOf:
            - $ref: '#/components/schemas/Address'

    Account:
      type: object
      required:
        [
          id,
          accountId,
          accountLabel,
          brand,
          name,
          emails,
          tags,
          addresses,
          financials,
        ]
      properties:
        id:
          type: string
          description: >
            The account's identifier: an opaque, stable id when the account
            has one, otherwise the account number as a string -- the same
            contract as an order's `id`. The opaque form is recognisable by
            its `ACCT_` prefix, though both forms address this account.
            Distinct from `accountId`.
          example: ACCT_vY9KecqAFCwFuY
        accountId:
          type: string
          description: >
            Account identifier in JWT format. Distinct from `id`: this is the
            form carried in access tokens and used across WHCC services.
          example: whcc_88888
        accountLabel:
          type: string
          description: UI-display value for the account, unique per brand.
          example: '88888'
        brand:
          type: string
          description: Brand name resolved from brands table.
          example: WHCC
        contact:
          type: string
          nullable: true
          description: Contact person named on the account's finance record. Null when the account has no finance record.
          example: Doc Brown
        emails:
          type: array
          items:
            type: string
            format: email
          example: ['doc@example.com']
        name:
          type: string
          description: Account/studio name.
          example: Brown Photography
        phone:
          type: string
          nullable: true
          example: '555-867-5309'
        tags:
          type: array
          items:
            type: string
          description: >
            Account tags derived from clientTypes flags, sorted alphabetically.
            Boolean flags appear as simple strings (e.g. "charity", "csp",
            "enterprise", "gallery", "hive", "influencer", "partner",
            "project", "speaker").
            earlyAccess appears as "earlyAccess:{value}" when set (always last).
          example: ['gallery', 'partner']
        addresses:
          type: object
          properties:
            shipping:
              $ref: '#/components/schemas/Address'
            billing:
              # Wrap with allOf so `nullable: true` isn't dropped as a $ref sibling.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Address'
        financials:
          type: object
          required: [payment]
          properties:
            paymentTerms:
              type: string
              nullable: true
              deprecated: true
              description: >
                Deprecated -- use `financials.payment.terms` instead.
                Raw payment-terms code as recorded in the source system, only
                trimmed (e.g. `"COD"`, `"NET 30"`). For a display-friendly
                normalized form, use `payment.terms`. Will be removed in a
                future major version.
              example: 'NET 30'
            activityReports:
              type: object
              additionalProperties:
                type: string
                format: uri
              nullable: true
              description: Map of year to activity report URL
            payment:
              $ref: '#/components/schemas/AccountPayment'
            tax:
              # Wrap with allOf so `nullable: true` isn't dropped as a $ref sibling.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AccountTax'
        identity:
          # Wrap with allOf so `nullable: true` isn't dropped as a $ref sibling.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AccountIdentity'

    AccountIdentity:
      type: object
      required: [organizationId, userId]
      description: >
        This account's identifiers in the namespace of the identity system
        that issues its logins and API keys. The whole object is null when
        the account has no record there. When it is present,
        `organizationId` is always set; `userId` may be null for a caller
        whose credential does not identify a user.

        The account's own identifier is the top-level `id`, not a member of
        this object. That system holds it as the organization's external id,
        so use `id` when addressing this account by external id there.
      properties:
        organizationId:
          type: string
          description: >
            Identity-system organization identifier. This is the organization
            that owns the account's API keys.
          example: org_01KVXFEJ9JA6YQXS15XA2GNH3T
        userId:
          type: string
          nullable: true
          description: >
            The identity-system user recorded for this account. Exactly one
            user is recorded per account, so this is the account's user --
            not necessarily the person who made this request, and not a list
            of everyone who can sign in. It does not indicate whether the
            account signs in through that system today.

            Null when the credential used for this request does not identify
            a user. Treat it as absent rather than assuming it is always
            populated, even if it is populated on every response you
            currently observe.
          example: user_01KVXFEJ9JA6YQXS15XA2GNH3T

    AccountPayment:
      type: object
      required: [provider, status, terms, methods, requirements, actions]
      description: >
        The account's payment profile -- terms, vault state, saved methods,
        and what's required of the account. Suggested client behavior per
        `status`:

          * status=ok, methods non-empty: render the saved methods, default
            first
          * status=ok, methods empty: prompt to add a payment method (the
            customer is enrolled with the payment provider but has no methods
            on file)
          * status=no_customer: prompt to add a payment method (same UX as
            enrolled-but-empty)
          * status=unavailable: show a soft warning ("we couldn't load saved
            payment methods, please try again"); allow the user to proceed and
            add a fresh method
          * status=not_requested: methods were not loaded because the caller
            did not request them via `?expand=paymentMethods`. Re-fetch with
            the expand parameter when you actually need to render saved cards.
      properties:
        provider:
          type: string
          description: >
            Lowercase identifier of the payment provider that holds these
            methods. Free-form string (not an enum) so additional providers
            can be added without a contract change.
          example: braintree
        status:
          type: string
          description: >
            Open string (deliberately not an `enum` so the API can introduce
            new statuses without a breaking schema change). Known values:
            `ok`, `no_customer`, `unavailable`, `not_requested`. Clients
            should treat any unknown value as `unavailable` (i.e. methods
            cannot be relied on for checkout). See the parent `AccountPayment`
            description for suggested client behavior per known value.
          example: not_requested
        terms:
          type: string
          nullable: true
          description: >
            Display-friendly payment terms for the account. Known values:
            "Net 7", "Net 30", "Net 60", "Per Order Credit Card", "Weekly Credit Card". Null when no billing
            record exists for the account. Open string (not an enum) so
            additional terms can be added without a contract change.
            Unaffected by requirements.enforcementExemption: an exemption
            suppresses the effective requirement booleans, but terms remains
            the account's underlying billing arrangement, so an exempt COD
            account still reports "Per Order Credit Card".
          example: 'Net 7'
        methods:
          type: array
          description: >
            Saved payment methods. Always present; may be empty
            (`status=no_customer`, `status=unavailable`, and
            `status=not_requested` always carry an empty array). When
            `status=ok`, ordering is deterministic: default first, then by
            descending expiration year and month (for cards), then by
            ascending token.
          items:
            $ref: '#/components/schemas/PaymentMethod'
        requirements:
          $ref: '#/components/schemas/AccountPaymentRequirements'
        actions:
          nullable: true
          description: >
            Always `null` on this (read-only) operation -- minting a launch
            token is a side effect and has its own dedicated endpoint, `POST
            /account/payment-method-actions`, whose `200` response body is
            shaped exactly like this field used to be. This field is kept
            for schema stability but never populated by `GET /account`.
          allOf:
            - $ref: '#/components/schemas/PaymentActions'

    PaymentActions:
      type: object
      required: [setCard]
      properties:
        setCard:
          $ref: '#/components/schemas/SetCardAction'

    SetCardAction:
      type: object
      required: [url, expiresAt]
      description: >
        A single-use launch link for setting the account's card on file.
        Navigate/redirect the user to `url`; do not attempt to construct
        this URL yourself or reuse it past `expiresAt`.
      properties:
        url:
          type: string
          format: uri
          description: >
            Single-use launch URL carrying a short-lived signed token.
            Treat as sensitive -- do not log the full URL.
          example: 'https://payments.whcc.com/card?t=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...'
        expiresAt:
          type: string
          format: date-time
          description: When the launch URL stops working. Re-request the expansion for a fresh one.
          example: '2026-07-11T12:15:00.000-05:00'

    AccountPaymentRequirements:
      type: object
      required:
        [cardAtCheckout, cardOnFile, authoritative, enforcementExemption]
      description: >
        Effective account requirements after account-wide exemptions. Always
        populated, with or without paymentMethods expansion. These are independent
        signals -- an account can need a card on file (for weekly automated
        billing) without needing one collected at checkout, and vice versa.
        Enforce a missing saved card only when authoritative is true,
        enforcementExemption is null, cardOnFile is true, payment.status is ok
        or no_customer, and no card method exists.
      properties:
        authoritative:
          type: boolean
          description: >
            Whether billing classification or an explicit account-wide exemption
            supports these requirements. Independent of payment.status. If false,
            the booleans are compatibility defaults and must not block or hold.
            During rolling deployment, treat missing or unknown authority as
            non-authoritative and fail open.
          example: true
        enforcementExemption:
          type: string
          nullable: true
          minLength: 1
          description: >
            Open account-wide payment-enforcement exemption code; null means none.
            Known codes: internal_account, test_account. Any non-null code,
            including an unknown future code, means exempt: authoritative is true
            and both effective requirement booleans are false. Consumers need no
            account-number list.
          example: internal_account
        cardAtCheckout:
          type: boolean
          description: >
            Whether the account must collect a credit card during the
            checkout flow rather than being invoiced. True for accounts
            settled per-order; false for accounts on net terms or with an
            account-wide enforcement exemption.
          example: false
        cardOnFile:
          type: boolean
          description: >
            Whether the account must keep a card vaulted with the payment
            provider. True for accounts that are auto-charged (per-order or
            on a recurring weekly cadence); false for accounts that pay by
            check or other manual settlement, or have an account-wide
            enforcement exemption.
          example: true

    PaymentMethod:
      type: object
      required: [type, token, isDefault]
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardPaymentMethod'
      description: >
        Polymorphic saved payment method. Today only `type: card` is emitted.
        Other `type` values are reserved so additional method types (PayPal
        accounts, Apple Pay, Google Pay, bank accounts, Venmo) can be added
        in the future without breaking consumers.
      properties:
        type:
          type: string
          enum: [card, paypal, apple_pay, google_pay, bank_account, venmo]
          description: >
            Discriminator. Today only `card` is emitted; the other values are
            reserved for forward compatibility.
        token:
          type: string
          description: >
            Persistent identifier for the saved method, scoped to the
            account's payment provider. Reusable across multiple transactions;
            this is NOT a single-use nonce. Treat as sensitive: do not log or
            leak outside the authenticated session.
          example: abc123vault
        isDefault:
          type: boolean
          description: Whether this is the account's default method.
          example: true

    CardPaymentMethod:
      allOf:
        - $ref: '#/components/schemas/PaymentMethod'
        - type: object
          required: [card]
          properties:
            card:
              $ref: '#/components/schemas/CardDetails'

    CardDetails:
      type: object
      required: [network, last4, expirationMonth, expirationYear, expired]
      properties:
        network:
          type: string
          description: >
            Lowercase card network. Known values: `visa`, `mastercard`,
            `discover`, `amex`, `other`. Type stays `string` (not a strict
            enum) so unexpected values do not break clients; unrecognized
            networks fall back to `other`.
          example: visa
        last4:
          type: string
          example: '1111'
        expirationMonth:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
        expirationYear:
          type: integer
          example: 2027
        expired:
          type: boolean
          description: >
            Whether the card is currently expired, computed by the payment
            provider (the source of truth for decline behavior). Flips to
            `true` on the 1st of the month FOLLOWING the expiration month --
            so a card with `expirationMonth=4, expirationYear=2026` reports
            `expired: false` until 2026-05-01. Consumers can derive
            "expires this month" UI from the date pair separately.
          example: false
        cardholderName:
          type: string
          nullable: true
          description: >
            Name on the card. Null when no name is on file at the payment
            provider.
          example: John Smith

    AccountTax:
      type: object
      required: [taxable, exemptCertificate]
      description: >
        Sales-tax info for the account. Null on the parent when the account
        has no billing record on file or no tax data has been configured.
      properties:
        taxable:
          type: boolean
          description: >
            Whether sales tax will be charged on this account's orders. The
            underlying tax-schedule classification is intentionally not
            surfaced -- consumers should treat this as the single source of
            truth for "will tax appear on the invoice?".
          example: true
        exemptCertificate:
          # Wrap with allOf so `nullable: true` isn't dropped as a $ref sibling.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExemptCertificate'

    ExemptCertificate:
      type: object
      required: [number, date]
      description: >
        Sales-tax exempt certificate on file for the account. Present
        independently of `taxable` -- a certificate may be on file even if
        the account is currently classified as taxable (or vice versa).
      properties:
        number:
          type: string
          description: Certificate identifier.
          example: 'ABC123'
        date:
          type: string
          description: >
            Free-form date string. Format is not guaranteed to be ISO 8601;
            commonly US-style "M/D/YYYY".
          example: '5/12/2024'

    Address:
      type: object
      description: >
        A postal address as this API reads it back, wherever one appears --
        an account's shipping and billing addresses and a shipment's
        destination.


        **Five members are carried under two names.** `attn`, `addr1`,
        `addr2`, `zip` and `country` are the names Prospector uses, and are
        the same names this document's `ShipToAddress` already uses;
        `attention`, `line1`, `line2`, `postalCode` and `countryCode` are the
        names this schema has always used. Each pair is one value emitted
        twice and always identical, so reading either name reads the same
        address. Read the Prospector names in new code: the older spelling is
        deprecated and will be removed in the next major version. `name`,
        `city` and `state` are spelled the same in both and appear once.


        This is a read-only shape -- nothing in this API accepts an `Address`
        as input. The address you can write is `ShipToAddressWrite`, on
        `PUT /orders/{id}/shipping`.
      required:
        [addr1, line1, city, state, zip, postalCode, country, countryCode]
      properties:
        attn:
          type: string
          nullable: true
          description: >
            Attention line. Same value as the deprecated `attention`.
          example: Doc Brown
        attention:
          type: string
          nullable: true
          deprecated: true
          description: >
            Deprecated -- use `attn` instead. The same value, under the name
            this schema used before it converged on Prospector's. Will be
            removed in a future major version.
          example: Doc Brown
        name:
          type: string
          nullable: true
          description: Studio name (shipment addresses)
          example: Brown Photography
        addr1:
          type: string
          description: >
            First address line. Same value as the deprecated `line1`.
          example: 742 Evergreen Terrace
        line1:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `addr1` instead. The same value, under the name
            this schema used before it converged on Prospector's. Will be
            removed in a future major version.
          example: 742 Evergreen Terrace
        addr2:
          type: string
          nullable: true
          description: >
            Second address line. Same value as the deprecated `line2`.
          example: Suite 200
        line2:
          type: string
          nullable: true
          deprecated: true
          description: >
            Deprecated -- use `addr2` instead. The same value, under the name
            this schema used before it converged on Prospector's. Will be
            removed in a future major version.
          example: Suite 200
        city:
          type: string
          example: Springfield
        state:
          type: string
          example: MO
        zip:
          type: string
          description: >
            Postal code. Same value as the deprecated `postalCode`.
          example: '65801'
        postalCode:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `zip` instead. The same value, under the name
            this schema used before it converged on Prospector's. Will be
            removed in a future major version.
          example: '65801'
        country:
          type: string
          description: >
            ISO country code. Same value as the deprecated `countryCode`.
          example: US
        countryCode:
          type: string
          deprecated: true
          description: >
            Deprecated -- use `country` instead. The same value, under the
            name this schema used before it converged on Prospector's. Will be
            removed in a future major version.
          example: US

    OrderShipping:
      type: object
      description: >
        An order's shipping state: where the parcel is going, which shipping
        option it currently holds, and whether its shipping is billed to your
        own carrier account.
      required: [shipTo, thirdPartyBilled, deliveryLocation]
      properties:
        shipTo:
          $ref: '#/components/schemas/ShipToAddress'
        shippingOptionId:
          type: string
          description: >
            The shipping option the order currently holds, as the same
            identifier the shipping options list reports -- so selecting an
            option elsewhere is a copy rather than a lookup. Opaque and stable;
            do not parse it. Absent when the order holds none, which is
            ordinary for an order that is not billed to your own carrier
            account.
          example: USPS_1CLASS
        shippingCharge:
          description: >
            What the order is actually billed for its current shipping option,
            which can differ from that option's listed price. Absent when
            nothing is billed for shipping on this order.
          allOf:
            - $ref: '#/components/schemas/Money'
        thirdPartyBilled:
          type: boolean
          description: >
            Whether this order's shipping is billed to your own carrier
            account. Orders that are not cannot have their shipping changed
            through this API, and read as `false` here with the shipping option
            and charge absent.
          example: true
        deliveryLocation:
          description: >
            Where the order asked to end up: the same value, from the same
            derivation, that `deliveryLocation` reports on `GET /orders/{id}`
            for this order. A property of the order, not of its shipping state:
            it is answered on the read and on the response to a change, and a
            change request cannot set it.


            `pickup` does not appear here today. Pickup orders currently have
            no live shipment record, and answer `404` on `GET /orders/{id}/shipping`
            and the other shipping routes.
            That is a property of the current shipment model, not a guarantee
            about the vocabulary: do not read a shipping payload as proof that
            an order is not a pickup order.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/OrderDeliveryLocation'

    OrderShippingOptions:
      type: object
      description: >
        The shipping options an order may be moved to, and -- where there are
        none -- why.
      required: [options]
      properties:
        options:
          type: array
          description: >
            In catalogue order. Always present; empty where nothing is offered
            for this order, in which case `unavailable` says why.
          items:
            $ref: '#/components/schemas/ShippingOption'
        unavailable:
          description: >
            Why `options` is empty, in the same shape an option's own
            availability takes. Absent whenever there are options to list, and
            absent too on the rare empty list no reason was given for.
          allOf:
            - $ref: '#/components/schemas/ShippingOptionAvailability'

    ShippingOption:
      type: object
      description: >
        One thing an order may be moved to ship on, priced for your account.


        Not a shipping method: the same carrier service delivered Saturday and
        delivered on a weekday are two options, because they differ in delivery
        date, price and availability.


        `label` is what to show a person; `id` is what to select the option by.
      required: [id, carrier, label, accessorials, price, current, availability]
      properties:
        id:
          type: string
          description: >
            The identifier a change names this option by, and the same one `GET
            /orders/{id}/shipping` reports as `shippingOptionId`. Opaque and
            stable: do not parse it, and do not construct one.
          example: USPS_1CLASS
        carrier:
          type: string
          description: >
            Who carries the parcel. Open string -- carriers are added without a
            change to this contract. Lowercase. Known values: fedex, usps, ups.
          example: usps
        label:
          type: string
          minLength: 1
          description: >
            The carrier's name for this option, for display -- including any
            extras it carries, such as Saturday delivery. Always present and
            never empty. Not an identifier: select and compare options by
            `id`.
          example: USPS Ground Advantage
        accessorials:
          type: array
          description: >
            Extras folded into this option, which change its delivery date,
            price or both -- so an option carrying one is a different option
            rather than the same one with a flag. Open array, empty on most
            options. Lowercase. Known value: saturday.
          items:
            type: string
          example: [saturday]
        price:
          description: >
            What this option costs your account. This is the option's price,
            which can differ from what the order is currently billed -- for
            that, read `shippingCharge` on the order's shipping state.
          allOf:
            - $ref: '#/components/schemas/Money'
        current:
          type: boolean
          description: >
            Whether this is the option the order holds today -- what a change
            would be moving it from. Exactly one option in the list carries
            `true`.


            Advisory: it is what this list saw. `GET /orders/{id}/shipping` is
            the authority, and is where the validator for a change comes from.
          example: true
        estimatedDeliveryDate:
          type: string
          format: date
          description: >
            When the parcel would arrive on this option. **Absent where nothing
            dated it, which is ordinary rather than a fault** -- most options
            are undated. It is not an availability claim: a date says when the
            parcel would arrive if the carrier takes it, not that it will.
          example: '2026-09-12'
        availability:
          $ref: '#/components/schemas/ShippingOptionAvailability'

    ShippingOptionAvailability:
      type: object
      description: >
        Whether an order may take an option and, where it may not, why.


        Three-valued deliberately: `unknown` is not a euphemism for available
        and not an error -- it means a check has not been run, and an option
        carrying it can still be chosen. Treat an `unknown` option as
        selectable and show `detail` to a customer who asks.
      required: [status, detail]
      properties:
        status:
          type: string
          description: >
            Open string. Known values: `available` (every check was run and
            said yes), `unavailable` (one said no -- `reason` says which),
            `unknown` (one has not been run). Treat a value you do not
            recognise as unavailable rather than as an error.
          example: unknown
        reason:
          type: string
          description: >
            Which check refused. Present exactly when `status` is
            `unavailable`, absent otherwise. Open string -- reasons arrive as
            checks arrive and go when a check goes, so branch on the ones you
            know and treat an unrecognised one as unavailable. Known values:
            `not-serviceable` (the carrier does not reach this destination on
            this service: a route the carrier has declined to serve, or a PO
            Box for a FedEx option; where the carrier's answer is not known
            the option reads `unknown` instead), `country-not-supported` (the option and the
            destination are not both in the one country served today),
            `not-billable-to-partner` (you hold no carrier account this
            option's carrier could bill the label to).
          example: not-serviceable
        detail:
          type: string
          description: >
            What to say to the person asking. Always present, and the member to
            show when `status` alone would not explain anything -- which is the
            common case today.
          example: >-
            Whether the carrier reaches this destination on this service has
            not been measured. The option can still be chosen.

    ShipToAddress:
      type: object
      required:
        [attn, name, addr1, addr2, addr3, city, state, zip, country, phone]
      description: >
        Where an order's parcel is going, as this API reads it back.


        **This is what the stores hold, relayed as they hold it.** Nothing here
        is normalised, padded or corrected on the way out, and no member is
        constrained: values predating this API can be shorter, longer or
        differently formatted than a change to the address would accept. Every
        member is always present, `null` where nothing is held, so an unchanged
        read-modify-write is a straight copy -- every member is `required` here
        for that reason, though any of them may be `null`. A blank string is a
        real stored value and is not the same as `null`.


        The rules a *change* must satisfy are on the shipping change operation,
        not here.
      properties:
        attn:
          type: string
          nullable: true
          description: The person the parcel is addressed to.
          example: Dana Whitfield
        name:
          type: string
          nullable: true
          description: The business or studio name on the label, where there is one.
          example: Whitfield Studio
        addr1:
          type: string
          nullable: true
          example: 64 Dikeman St
        addr2:
          type: string
          nullable: true
        addr3:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          example: Brooklyn
        state:
          type: string
          nullable: true
          description: State or province. Absent for destinations that have none.
          example: NY
        zip:
          type: string
          nullable: true
          example: '11231-1506'
        country:
          type: string
          nullable: true
          description: Two-letter country code. Stored values may be in either case.
          example: US
        phone:
          type: string
          nullable: true
          description: >
            Contact number for the delivery. Stored in a range of formats;
            newer values are in E.164.
          example: '+17185551234'

    Money:
      type: object
      description: >
        An amount of money.


        This is the shape every amount in this document is converging on, and
        the shipping resources use it exclusively.


        `financials` and its line items carry each amount twice: once as this
        object, under `amounts`, and once as the older decimal string beside a
        sibling `currency`. The older members are deprecated and will be
        removed in a future major version. Read `amounts` in new code; nothing
        you read today changes meaning before that major.
      required: [value, code]
      properties:
        value:
          type: string
          description: Amount, always to two decimal places.
          example: '1.00'
        code:
          type: string
          description: ISO 4217 currency code.
          example: USD

    OrderShippingPreview:
      type: object
      description: >
        What a shipping change would do, with nothing written.


        **Every member is a statement about the previewed change**, never about
        the order as it stands. That is what makes the body readable beside a
        state read: anything here that did not move is something the change
        would not have moved. It is also why `deliveryLocation` is not here --
        it is a property of the order that no shipping change can alter, so
        reporting it would be answering a different question in the middle of
        this one.


        **Exactly one of `refusal` and the two money members is populated.**
        A change that would be made settles money and carries `refusal: null`;
        one that would be refused settles nothing and carries `shippingCharge`
        and `amounts` as `null`. `shipTo` and `options` are populated either
        way: they are what you asked for and what is on offer, and both are
        answers whichever way the change would go.
      required:
        [
          shipTo,
          thirdPartyBilled,
          shippingCharge,
          amounts,
          options,
          refusal,
          wouldChange,
        ]
      properties:
        shipTo:
          description: >
            The address the change would store -- what you sent, trimmed, with
            blank members cleared, `country` upshifted and `phone` written as
            E.164. Compare it with the address you sent to see what this service
            corrected.
          allOf:
            - $ref: '#/components/schemas/ShipToAddress'
        shippingOptionId:
          type: string
          description: >
            The option the change would leave the order holding. On a refusal,
            the one your body named, or the order's own where it named none.
            Absent on an order that holds no option, which is the same order
            that answers `thirdPartyBilled: false`.
          example: USPS_1CLASS
        shippingCharge:
          nullable: true
          description: >
            The shipping line the order would be billed under -- the same
            meaning this member has on `GET /orders/{id}/shipping` and on a
            successful change. It does **not** include tax, the statutory
            delivery fee or surcharges; `amounts` is where those land. `null`
            when `refusal` is set, because a refused change bills nothing.
          allOf:
            - $ref: '#/components/schemas/Money'
        thirdPartyBilled:
          type: boolean
          description: >
            Whether the order's shipping is billed to your own carrier account.
            `false` is a reading rather than a refusal, and the same reading
            `GET /orders/{id}/shipping` gives.
          example: true
        amounts:
          nullable: true
          description: >
            What the whole order would be worth after the change. `null` when
            `refusal` is set.
          allOf:
            - $ref: '#/components/schemas/PreviewedAmounts'
        options:
          description: >
            The options at the destination the change would move the parcel to
            -- at the order's own destination where the address does not move.
            Same item shape as `GET /orders/{id}/shipping/options`.


            ⚠️ **Where the address moves, `availability` reads `unknown`**,
            because whether a carrier reaches an address is read from the
            destination the order already has. `unknown` is not a refusal and
            such an option can still be chosen; re-read the options list after
            the change to see real availability at the new address.
          allOf:
            - $ref: '#/components/schemas/OrderShippingOptions'
        refusal:
          nullable: true
          description: >
            The problem document `PUT /orders/{id}/shipping` would answer for
            this change, whole -- or `null` where the change would be made.
            Parse it exactly as you parse a refused write; its own `status` is
            the status that write would have answered, and `code` is what you
            branch on. The response carrying it is a `200`, because finding this
            out is what you asked for.
          allOf:
            - $ref: '#/components/schemas/ShippingProblemDetails'
        wouldChange:
          type: boolean
          description: >
            Whether the change would actually change anything -- that is,
            whether it would move the order's validator. Always `false` on a
            refusal.


            ⚠️ It is not "the body differs from what you read". Restating a
            stored phone number in a different spelling reads as `true`, because
            this service writes it as E.164 and that is a different stored
            value.
          example: true

    PreviewedAmounts:
      type: object
      description: >
        What an order would be worth after a shipping change: the same four
        amounts `financials.amounts` carries on order detail, so "before" and
        "after" are the same four members rather than two vocabularies.


        ⚠️ **`statutoryDeliveryFee` is already included in `subtotal` and
        `total`.** It is one of the order's lines, the subtotal is the sum of
        the lines, and the total is subtotal less discount plus tax. It is
        published on its own so you can name it to a customer; adding it to
        `total` charges it twice.
      required: [subtotal, discount, tax, total]
      properties:
        subtotal:
          description: >
            The order's lines, the statutory delivery fee among them where the
            destination owes one.
          allOf:
            - $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          description: >
            The tax the destination the change would move to owes. A tax that
            could not be calculated fails the preview with `502 read-failed`
            rather than reading as zero.
          allOf:
            - $ref: '#/components/schemas/Money'
        total:
          description: Subtotal less discount, plus tax.
          allOf:
            - $ref: '#/components/schemas/Money'
        statutoryDeliveryFee:
          description: >
            The Colorado or Minnesota statutory delivery fee the destination
            owes. **Absent where it owes none** -- which is a different
            statement from a fee of zero, and a state fee is never zero.
            Already counted in `subtotal` and `total`.
          allOf:
            - $ref: '#/components/schemas/Money'
    ShippingChangeRequest:
      type: object
      description: >
        A replacement shipping state. Unknown keys are refused with `400`
        rather than ignored.
      required: [shipTo]
      additionalProperties: false
      properties:
        shipTo:
          $ref: '#/components/schemas/ShipToAddressWrite'
        shippingOptionId:
          type: string
          minLength: 1
          description: >
            The option to move the order onto, as an `id` from `GET
            /orders/{id}/shipping/options`. **Omit it to leave the order on the
            option it already holds** -- this is the only member of this request
            whose absence does not clear something. Sending the option the
            order already holds is a satisfied request that changes nothing.
          example: USPS_1CLASS

    ShipToAddressWrite:
      type: object
      description: >
        Where you are asking an order's parcel to go.


        **A full-state address: a member you omit is a member you are
        clearing.** This is the same field set `ShipToAddress` reads back, with
        the rules a change has to satisfy. Those rules are here and not on the
        read, because stored values predate them: an address you read back may
        legitimately be longer or differently formatted than one you may write.


        `addr1`, `city`, `zip` and `country` are required, and at least one of
        `attn` and `name`. That pair is enforced when the request is handled
        rather than by this schema, so the refusal can name the members. A `US`
        address needs a two-letter `state` and a `zip` of at least five
        characters. Every member is trimmed; a blank one clears.
      required: [addr1, city, zip, country]
      additionalProperties: false
      properties:
        attn:
          type: string
          maxLength: 50
          description: >
            The person the parcel is addressed to. Required unless `name` is
            given.
          example: Dana Whitfield
        name:
          type: string
          maxLength: 50
          description: >
            The business or studio name on the label. Required unless `attn` is
            given, so a consumer with no business name does not force one.
          example: Whitfield Studio
        addr1:
          type: string
          maxLength: 50
          example: 64 Dikeman St
        addr2:
          type: string
          maxLength: 50
        addr3:
          type: string
          maxLength: 50
        city:
          type: string
          maxLength: 35
          description: 35 characters, which is narrower than the other lines.
          example: Brooklyn
        state:
          type: string
          maxLength: 10
          description: >
            State or province. Required and exactly two letters on a `US`
            address; optional elsewhere, because much of the world has none.
          example: NY
        zip:
          type: string
          maxLength: 10
          description: >
            Postal code. At least five characters on a `US` address; ZIP+4 is
            accepted.
          example: '11231-1506'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: >
            Two-letter country code. Accepted in either case and upshifted. A
            change that moves the parcel to a different country is refused.
          example: US
        phone:
          type: string
          maxLength: 50
          description: >
            Contact number for the delivery, sent on in E.164. Common US
            shapes are read and converted; a value carrying letters or an
            extension is refused rather than guessed at.
          example: '+17185551234'

    ShippingProblemDetails:
      description: >
        RFC 7807 Problem Details for a shipping refusal that names which rule
        said no, extended with a stable machine-readable `code`.


        **Almost every one of these came from the service behind this one** and
        is relayed unaltered. The two exceptions are this service's own answers
        about its time budget -- `shipping_change_not_begun` and
        `shipping_change_unconfirmed` on `PUT /orders/{id}/shipping` -- and
        `code` tells you which is which by its casing: snake_case is this
        service, kebab-case is the one behind it.


        **`code` is an open string, not a fixed list.** Values are added as new
        rules arrive; branch on the ones you know and treat an unrecognised one
        as a refusal rather than as a fault. `detail` is the sentence to show a
        customer.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable identifier for the refusal.


                **Casing says which service decided.** The two values this
                service owns are snake_case: `shipping_change_not_begun` (503 --
                the change was never begun, so re-send it) and
                `shipping_change_unconfirmed` (504 -- the change was sent and
                never answered, so re-read before re-sending). Every other
                value is kebab-case and comes from the service behind this one,
                relayed unaltered. Known kebab-case values include `etag-mismatch` (412),
                `if-match-required` (428), `not-third-party-billed`,
                `order-not-editable`, `carrier-account-unresolvable`,
                `negative-balance-withheld`, `current-offer-unreadable` (409),
                `invalid-address`, `offer-not-available`,
                `boundary-crossing-withheld`, `credit-floor-withheld`,
                `region-surcharge-withheld`, `derived-charge-withheld`,
                `unwritable-fields` (422),
                `order-not-found` and `shipment-not-found` (404), and
                `read-failed`, `shipping-change-failed` and `unhandled-error`
                (502 -- the service behind this one reporting its own failure,
                answered under this status so that its failures stay
                distinguishable from this service's). Each operation's
                description lists the codes it can answer, with what re-sending
                does and how permanent each is.
              example: etag-mismatch
            reason:
              type: string
              description: >
                Why, in the same open vocabulary an option's
                `availability.reason` uses -- so "not yet" and "never" stay
                distinguishable. `offer-not-available` is the refusal that
                carries one today; it is relayed wherever it is sent, so a
                refusal that starts reporting one reaches you rather than
                having it dropped. Absent otherwise.
              example: not-serviceable

    AnyShippingProblemDetails:
      description: >
        Either shape a refusal on the shipping routes can take, told apart by
        whether `code` is present: with a `code` the service behind this one
        decided it and named which rule; without one, this service refused
        locally or could not tell what happened.


        ⚠️ `anyOf`, not `oneOf`. `ShippingProblemDetails` `allOf`-extends
        `ProblemDetails`, which sets no `additionalProperties: false`, so a body
        carrying `code` satisfies both branches -- and `oneOf` means exactly
        one, so a perfectly valid refusal would fail validation in a generated
        client.
      anyOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - $ref: '#/components/schemas/ShippingProblemDetails'

    AddressValidationProblemDetails:
      description: >
        RFC 7807 Problem Details for an address this service refused locally,
        before anything was sent or written.


        It carries no `code`: what you branch on is `invalidParams`, which names
        every offending member in one answer so a single round trip fixes them
        all. Members this service does not read are named for the first five
        only, each name truncated past 64 characters, followed by one entry on `shipTo` that counts
        the rest.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [invalidParams]
          properties:
            invalidParams:
              type: array
              description: >
                One entry per offending member, except that members this
                service does not read past the fifth are counted in a single
                entry on the object.
              items:
                $ref: '#/components/schemas/InvalidParam'

    InvalidParam:
      type: object
      description: One reason one part of a request could not be used.
      required: [name, reason]
      properties:
        name:
          type: string
          description: >
            Dotted path to the offending member, or to the object carrying the
            rule where no single member is at fault.
          example: shipTo.city
        reason:
          type: string
          description: What is wrong with it, in a sentence.
          example: Must be 35 characters or fewer.
        value:
          type: string
          description: >
            What was sent, truncated. Absent when there was nothing to echo --
            a required member you omitted.

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details
      required: [title, status]
      properties:
        type:
          type: string
          default: 'about:blank'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    UnsupportedApiVersionProblemDetails:
      type: object
      description: >
        The refusal of a `WHCC-API-Version` this API does not serve. It carries
        no `code` and no `instance`, so it stands alone rather than extending
        `ProblemDetails`: a body can then be told apart from every other `400`
        by its `type`, and a union that includes it never has to relax a
        sibling's required `code`. `supportedVersions` lists the months you may
        send.
      required: [type, title, status, detail, supportedVersions]
      properties:
        type:
          type: string
          enum: ['https://developer.whcc.com/problems/unsupported-api-version']
        title:
          type: string
          enum: ['Unsupported API version']
        status:
          type: integer
          enum: [400]
        detail:
          type: string
          example: "API version '2026-09' is not supported. Use one of the supported versions."
        supportedVersions:
          type: array
          items:
            type: string
          example: ['2026-10']

    EventSubscriptionDestination:
      description: >
        Where a subscription's events go. A **union over `type`**, not one object
        with optional fields: `type` is the discriminator, one variant exists
        today, and a second transport arrives as a new variant rather than as a
        new meaning for an existing field. Generate a client from the variant,
        not from this name -- the union is what keeps a future `email` arm from
        demoting `callbackUri` and `version` to optional on everything already
        published.


        **Tolerate an unrecognised `type` on a read.** One account can hold
        several subscriptions, so a client that knows only `webhook` can meet a
        destination it does not recognise without ever having asked for one --
        skip the entry or surface it opaquely, never fail the response.
      oneOf:
        - $ref: '#/components/schemas/WebhookDestination'
      discriminator:
        propertyName: type
        mapping:
          webhook: '#/components/schemas/WebhookDestination'

    WebhookDestination:
      type: object
      description: >
        An HTTPS endpoint that receives signed POSTs. The `webhook` arm of
        `EventSubscriptionDestination`, declared standalone rather than by
        `allOf` on the union: a variant that composed the union it belongs to
        would validate against its own siblings.
      required: [type, callbackUri]
      properties:
        type:
          type: string
          description: >
            Destination transport. `webhook` is the only value this API emits
            today, and it is deliberately **not** declared as a closed enum here:
            this is the read shape, and a client that knows only `webhook` has to
            be able to meet a destination it does not recognise without failing
            the response. The write shape is closed --
            `CreateWebhookDestination` -- because a write this API cannot honour
            is `422 unsupported_destination_type` rather than something to
            tolerate.
          example: webhook
        callbackUri:
          type: string
          format: uri
          description: >
            Absolute `https` URL that receives deliveries, at most 2048
            **bytes**, carrying no `user:pass@` prefix. The limit is the storage
            column's own width and `varchar` counts bytes, so a URL carrying
            non-ASCII characters reaches it sooner than its character count
            suggests. `https` is the only
            accepted scheme; anything else, a URL that is empty once tab,
            carriage return and line feed are stripped, or one carrying any of
            those characters, is `422 invalid_callback_uri`. A URI written now
            is on port `443` or `8443`; one written before that rule may carry
            any port, and is still delivered to. Delivery itself
            refuses an endpoint that resolves to a private address, so
            registering one here registers an endpoint nothing will call.
          example: 'https://partner.example.com/whcc/events'
        version:
          type: integer
          enum: [1, 2]
          default: 2
          description: >
            Payload version. Omit it for `2`, which is the only version that
            carries rejected and cancelled orders. Always present on a read.


            Version `1` is created behind `apikey:oas`, carries `order.accepted`
            and `order.shipped`, and delivers the ImageDownload body to a `*`
            subscription only. It is fixed at create.
          example: 2

    CreateEventSubscriptionDestination:
      description: >
        Where to send this subscription's events, on a **write**. The same union
        as `EventSubscriptionDestination` and deliberately not the same schema:
        a read must tolerate a `type` it does not recognise, and a write must
        refuse one. Declaring both off one schema would either open the write to
        bodies this endpoint answers `422` or close the read against a transport
        added after the client was generated.
      oneOf:
        - $ref: '#/components/schemas/CreateWebhookDestination'
      discriminator:
        propertyName: type
        mapping:
          webhook: '#/components/schemas/CreateWebhookDestination'

    CreateWebhookDestination:
      type: object
      description: >
        An HTTPS endpoint to send signed POSTs to. The write arm of
        `CreateEventSubscriptionDestination`.


        **Closed, because the endpoint refuses unknown members rather than
        ignoring them.** OpenAPI admits additional properties by default, so
        leaving this object open -- as the top-level create body is not --
        generates validators that accept bodies this endpoint answers `400`. The
        member most likely to be sent is `webhookVersion`, from the superseded
        `register` contract; here it is `version`.
      required: [type, callbackUri]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [webhook]
          description: >
            Destination transport. `webhook` is the only value this API accepts
            on a write; anything else is `422 unsupported_destination_type`. The
            enum is closed here and open on the read shape
            (`EventSubscriptionDestination`), which is the difference between a
            value this API will not honour and one a client may not recognise.
          example: webhook
        callbackUri:
          type: string
          format: uri
          description: >
            Absolute `https` URL that receives deliveries, at most 2048
            **bytes**, carrying no `user:pass@` prefix. The limit is the storage
            column's own width and `varchar` counts bytes, so a URL carrying
            non-ASCII characters reaches it sooner than its character count
            suggests. `https` is the only accepted scheme; anything else, a URL
            that is empty once tab, carriage return and line feed are stripped,
            or one carrying any of those characters, is
            `422 invalid_callback_uri`. The port must be `443` or `8443`,
            written in the URL or implied by `https` -- the ports a test event
            is delivered to; any other port is `422 invalid_callback_uri`. On
            `PUT`, resending the subscription's current `callbackUri` unchanged
            is accepted whatever its port. Delivery itself refuses an endpoint
            that resolves to a private address, so registering one here
            registers an endpoint nothing will call.
          example: 'https://partner.example.com/whcc/events'
        version:
          type: integer
          enum: [1, 2]
          default: 2
          description: >
            Payload version. Omit it for `2`, which is the only version that
            carries rejected and cancelled orders.


            **Version 1 requires the `apikey:oas` scope**: a create asking for
            it from a credential without that scope is refused
            `403 insufficient_scope` and nothing is written. With the scope it
            carries `order.accepted` and `order.shipped`, and delivers the
            ImageDownload body to a `*` subscription only.
          example: 2

    EventSubscriptionStatusDetail:
      type: object
      description: >
        Why a subscription is not receiving, and since when. Null while it is
        `active`, and also null on a subscription that has just been created --
        it is stopped because that is how subscriptions start, not because
        anything happened to it.
      required: [reason, since]
      properties:
        reason:
          type: string
          description: >
            `user` -- you stopped it. `deliveryFailures` -- WHCC stopped it after
            repeated delivery failures. Treat as an open enum.
          example: user
        since:
          type: string
          format: date-time
          description: When it stopped, in UTC.
          example: '2026-09-14T10:12:04Z'

    EventSubscriptionDeliveryError:
      type: object
      description: The most recent failed delivery, or null if the last attempt succeeded and none has failed since.
      required: [at, statusCode, reason]
      properties:
        at:
          type: string
          format: date-time
          example: '2026-09-14T10:12:04Z'
        statusCode:
          type: integer
          nullable: true
          description: >
            The HTTP status the endpoint answered. Null wherever no HTTP response
            arrived at all -- a refused connection, a TLS failure, a timeout --
            which is the commonest kind of delivery failure.
          example: 502
        reason:
          type: string
          nullable: true
          example: 'connection refused'

    EventSubscription:
      type: object
      description: One account-level event subscription.
      required:
        [
          id,
          accountNo,
          destination,
          eventTypes,
          description,
          status,
          statusDetail,
          lastDeliveryError,
          createdAt,
          modifiedAt,
        ]
      properties:
        id:
          type: string
          pattern: '^[A-Z]{2}_[A-Za-z0-9]{16}$'
          description: Read-only identifier, case-sensitive.
          example: 'SUB_7Kq2mZ1x9PdR4t'
        accountNo:
          type: integer
          description: >
            Read-only. The account the credential belongs to. No request can name
            an account, on any operation of this resource.
          example: 1114
        destination:
          $ref: '#/components/schemas/EventSubscriptionDestination'
        eventTypes:
          type: array
          description: >
            The events this subscription receives, always as dotted names.
            `["*"]` means every event type the subscription's `destination.version`
            can carry.
          items:
            type: string
            description: >
              Known values: `order.accepted`, `order.rejected`, `order.shipped`,
              `order.cancelled`, and `*`. `order.rejected` and `order.cancelled`
              exist only at `destination.version: 2`. Treat as an open enum.
          example: ['order.accepted', 'order.rejected', 'order.shipped']
        description:
          type: string
          nullable: true
          maxLength: 255
          example: 'Sunshine Photo Cart -- production'
        status:
          type: string
          description: >
            `disabled` -- you stopped it, or it has not been enabled yet.
            `active` -- receiving. `suspended` -- WHCC stopped it after repeated
            delivery failures.


            **Treat as an open enum.** An unrecognised value means *not active*,
            and must not be read as `disabled`, which means something you did.
          example: disabled
        statusDetail:
          allOf:
            - $ref: '#/components/schemas/EventSubscriptionStatusDetail'
          nullable: true
        lastDeliveryError:
          allOf:
            - $ref: '#/components/schemas/EventSubscriptionDeliveryError'
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: UTC.
          example: '2026-09-14T10:12:04Z'
        modifiedAt:
          type: string
          format: date-time
          description: UTC.
          example: '2026-09-14T10:12:04Z'

    CreatedEventSubscription:
      description: >
        The subscription, plus the signing secret. **The secret appears here and
        nowhere else** -- no read operation returns it, not even partially.
      allOf:
        - $ref: '#/components/schemas/EventSubscription'
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: >
                The key every delivery to this subscription is signed with. Store
                it now; it cannot be read back.
              example: 'Rk9v2xQ0aJ7pM4sT1wYh8cZdE3bN6uLgKiO5rXyA9fQ'

    Delivery:
      type: object
      description: >
        One delivery ATTEMPT against a subscription, as WHCC recorded it.


        `callbackUri` and the request and response bodies are recorded but are not
        published by this operation: returning them in a list would cost a lookup
        per row against a wide column.
      required:
        [
          id,
          notifyUid,
          attemptedAt,
          eventType,
          version,
          outcome,
          statusCode,
          latencyMs,
          attempt,
          willRetry,
          reason,
        ]
      properties:
        id:
          type: string
          nullable: true
          description: >
            This attempt's opaque identifier: `DLV_` followed by fourteen
            alphanumeric characters. Store it, quote it to WHCC support, and
            deduplicate on it across polls.


            `null` on an attempt recorded before this field existed. Treat it as
            opaque: nothing is encoded in it, and match it whole rather than
            parsing it.
          pattern: '^DLV_[A-Za-z0-9]{14}$'
          example: DLV_7Kq2mZ1x9PdR4t
        notifyUid:
          type: integer
          nullable: true
          description: >
            The notification this attempt carried. `POST
            /event-subscriptions/{id}/test` returns the same value, so the
            attempts a test send caused are the rows matching it.


            **One notification, several attempts.** A retry ladder writes a row
            per attempt and they all carry this value; `id` is what tells them
            apart. `null` on an attempt recorded before this field existed.
          example: 48211907
        attemptedAt:
          type: string
          format: date-time
          description: >
            When the attempt was made, ISO-8601 UTC. Named for what it is: a row
            exists whether or not anything was delivered.
          example: '2026-09-30T14:03:22Z'
        eventType:
          type: string
          nullable: true
          description: >
            The dotted event type this attempt carried. `null` means WHCC could
            not resolve one and delivered the notification anyway, which a
            subscription selecting `*` can receive.
          example: order.shipped
        version:
          type: integer
          description: >
            The payload version this attempt was sent at -- the same fact the
            subscription publishes as `destination.version`.
          example: 2
        outcome:
          type: string
          enum: [succeeded, failed]
          description: >
            `succeeded` for a 2xx, `failed` for anything else including no
            response at all.
        statusCode:
          type: integer
          nullable: true
          description: >
            The HTTP status the attempt ended on, or `null` when nothing
            answered -- DNS failure, refused connection, TLS failure, a
            client-side timeout. `reason` names which. This is the same
            convention `EventSubscription.lastDeliveryError.statusCode` follows,
            so one failure reads the same way on both.
          example: 200
        latencyMs:
          type: integer
          nullable: true
          description: Round-trip milliseconds.
          example: 145
        attempt:
          type: integer
          nullable: true
          description: Which attempt on the retry ladder this was, counting from 1.
          example: 1
        willRetry:
          type: boolean
          nullable: true
          description: >
            Whether WHCC intended another attempt after this one. Taken after the
            retry cap, so it cannot be inferred from `statusCode` alone.
        reason:
          type: string
          nullable: true
          description: >
            A short category for a failed attempt -- `http 500`, `timeout`,
            `transport error`. Never your response body. `null` on success.
          example: http 500

    DeliveryPagination:
      type: object
      description: >
        Where this page sits, and the cursors to the pages either side. The
        cursor directions are the shared `Pagination` schema's -- `nextBefore`
        is older, `nextAfter` is newer -- so one client paginator reads this
        operation and `GET /orders` alike.


        Defined separately rather than composed with `allOf`, which does not
        replace a referenced schema's per-property descriptions: the two schemas
        differ in WHEN a cursor is published, not in what it means. `GET /orders`
        publishes only the direction the page was read in; this operation
        publishes both on any non-empty page, so that the newest attempt's cursor
        is always in hand to poll with. Composing them would publish the wrong
        nullability rule in generated documentation.
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
          description: The page size that was applied.
          example: 25
        hasMore:
          type: boolean
          description: >
            Whether more attempts exist in the direction this page was read.
        nextBefore:
          type: string
          nullable: true
          description: >
            Opaque cursor to the page of **older** attempts. Present on any
            non-empty page. Asking when none exist returns an empty page.
          example: MjIxOTQyMDE
        nextAfter:
          type: string
          nullable: true
          description: >
            Opaque cursor to the page of **newer** attempts. Present on any
            non-empty page, so it can be replayed to poll for attempts that have
            happened since. Asking when none exist returns an empty page.
          example: MjIxOTQyMjc

    DeliveryListResponse:
      type: object
      description: One page of delivery attempts, newest first.
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        pagination:
          $ref: '#/components/schemas/DeliveryPagination'
    RotateEventSubscriptionSecretRequest:
      type: object
      description: >
        Optional, and usually omitted entirely. Every field defaults, so an
        absent body and `{}` are the same request.
      additionalProperties: false
      properties:
        expiresIn:
          type: integer
          nullable: true
          minimum: 3600
          maximum: 2592000
          default: 3600
          description: >
            How long the secret this rotation replaces keeps signing
            deliveries alongside the fresh one, in seconds. Omit it, send
            `null`, or send `{}` for the default of one hour, which is also
            the minimum.


            **An hour is your runway to install the new secret, not a promise
            that every delivery already in flight stays verifiable.** A
            delivery is signed when it is sent, and a failing one is retried
            for up to 9,330 minutes -- 6 days, 11.5 hours. A delivery first
            sent before you rotated can therefore arrive long after the
            overlap has closed, carrying only the secret the rotation
            retired. If you need those to keep verifying, ask for a window
            that covers the retry ladder (`559800` or more) rather than
            taking the default, or keep the previous secret on your side
            until the ladder is exhausted.
          example: 3600

    EventSubscriptionListResponse:
      type: object
      description: >
        The calling account's subscriptions. An envelope rather than a bare
        array, so a later `pagination` member is additive -- there is none today
        because the per-account cap bounds the collection at 25 subscriptions.


        Note what the items are: `EventSubscription`, which has no
        `signingSecret` member at all. A read cannot return the secret.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSubscription'

    CreateEventSubscriptionRequest:
      type: object
      description: >
        **Unknown fields are refused, not ignored**, which is why this object is
        declared closed: OpenAPI admits additional properties by default, so a
        schema leaving them open generates validators that accept bodies this
        endpoint answers `400`. In particular a top-level `webhookVersion` is
        refused -- the payload version is `destination.version` -- and so is any
        field naming an account.
      required: [destination]
      additionalProperties: false
      properties:
        destination:
          $ref: '#/components/schemas/CreateEventSubscriptionDestination'
        eventTypes:
          type: array
          minItems: 1
          description: >
            Which events to receive. Omit for `["*"]`, every event type your
            `destination.version` can carry, which is what an existing integration
            would expect.


            Dotted names are canonical. The legacy wire spellings -- `Processed`,
            `Shipped`, `Order Cancelled` -- are accepted on input and normalised;
            `Processed` covers both `order.accepted` and `order.rejected`, because
            nothing in a selection distinguishes them. Responses are always dotted.


            `["*"]` cannot be combined with named types.
          items:
            type: string
          example: ['order.accepted', 'order.rejected', 'order.shipped']
        description:
          type: string
          maxLength: 255
          description: Free text, for your own reference. At most 255 bytes.
          example: 'Sunshine Photo Cart -- production'
        signingSecret:
          type: string
          minLength: 32
          maxLength: 255
          description: >
            Supply your own key, or omit the field for a generated one. A supplied
            key must be 32 to 255 printable ASCII characters with no whitespace,
            and is stored exactly as sent -- nothing is trimmed, because a trimmed
            key is a key you do not have. Conditioned on
            `destination.type: webhook`, exactly as `version` is.
        acknowledgeIncompleteCoverage:
          type: boolean
          description: >
            Waives the refusal you get for selecting `order.accepted` without
            `order.rejected` -- a selection under which a rejected order produces
            no event at all.


            **Request-scoped: it is not stored and never returned.** A later
            update that still leaves coverage incomplete has to supply it again.


            It has no effect on a `destination.version: 1` subscription, because
            the refusal does not apply there: `order.rejected` does not exist at
            version 1, so there is nothing to add: the check never fires at
            version 1. A version 1 subscription cannot observe rejected orders
            by any selection; `destination.version: 2` is the only remedy.
          example: false

    UpdateEventSubscriptionRequest:
      type: object
      description: >
        A full replace of `destination`, `eventTypes` and `description` --
        **not a patch.** A field you omit is not carried over from the
        current resource: `eventTypes` omitted means `["*"]`, exactly as on a
        create, and `description` omitted means null. `id`, `accountNo`,
        `status` and `signingSecret` are all immutable and are refused by
        name if sent -- this object is declared closed for the same reason
        `CreateEventSubscriptionRequest` is.
      required: [destination]
      additionalProperties: false
      properties:
        destination:
          allOf:
            - $ref: '#/components/schemas/CreateEventSubscriptionDestination'
          description: >
            Same validation as a create's `destination`, with one addition:
            `version` cannot disagree with the subscription's current one.
            Omit it to keep the current version; send a different one and the
            request is refused, `422 destination_version_immutable`.
        eventTypes:
          type: array
          minItems: 1
          description: >
            Same rules as a create's `eventTypes`. Omit for `["*"]`.
          items:
            type: string
          example: ['order.accepted', 'order.rejected', 'order.shipped']
        description:
          type: string
          maxLength: 255
          description: Free text, for your own reference. At most 255 bytes. Omit to clear it.
          example: 'Sunshine Photo Cart -- production'
        acknowledgeIncompleteCoverage:
          type: boolean
          description: >
            Same as on a create, and not carried over from one: request-scoped,
            not stored, so a `PUT` that still leaves coverage incomplete has to
            supply it again.
          example: false

    EventTypeCatalogEntry:
      type: object
      description: >
        One event type this service knows, selectable or not.
      required:
        [eventType, wireEvent, available, versions, seeAlso, unavailableReason]
      properties:
        eventType:
          type: string
          description: The dotted name, as `eventTypes` carries it.
          example: order.rejected
        wireEvent:
          type: string
          description: >
            The legacy wire spelling this dotted name corresponds to. Informational
            only -- `eventTypes` accepts either spelling, but always echoes the
            dotted one back.
          example: Processed
        available:
          type: boolean
          description: >
            Whether any subscription may ever select this type, at any version.
            `false` means selecting it is always `422 unknown_event_type`;
            check `unavailableReason` and `seeAlso` for why and for what to
            select instead.
          example: true
        versions:
          type: array
          description: >
            The `destination.version` values this type is selectable at, when
            `available` is true. A type available at every version this
            service can create carries `[1, 2]`; one carrying only `[2]` is
            V2-only -- selecting it on a `destination.version: 1` subscription
            is `422 event_type_unavailable_for_version`.


            ⚠️ **Not empty when `available` is false.** An unavailable type
            still reports the versions it was ever carried at, so
            `order.image-download` publishes `available: false` with
            `versions: [1]`. Read `available` to decide whether a type may be
            selected at all; read `versions` only to decide at which payload
            versions an **available** one may be.
          items:
            type: integer
          example: [2]
        seeAlso:
          type: string
          nullable: true
          description: >
            Present on some unavailable types: the dotted name to select
            instead. Null where there is no substitute.
          example: order.rejected
        unavailableReason:
          type: string
          nullable: true
          description: >
            Present when `available` is false: why no subscription may select
            this type. Null when `available` is true.
          example: >-
            No V2 payload exists for this event. At V2 an image-download
            notification either reroutes to a Processed/Rejected body (when
            there are image errors) or sends nothing at all (when there are
            none), so there is no V2 body a subscriber could receive under
            this name.

    EventTypeCatalogResponse:
      type: object
      description: >
        Every event type this service knows, in a stable order. Unpaginated:
        the vocabulary is small and fixed by this service's own deployment,
        not by anything a caller controls.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeCatalogEntry'

    TestEventRequest:
      type: object
      description: >
        Which event to fire, and optionally which of your orders to fire it
        against. No field carries payload data: the shipment rows and image
        errors a synthetic payload needs are generated by WHCC, so nothing a
        caller sends can put a tracking number that looks real into a webhook.
      required: [eventType]
      additionalProperties: false
      properties:
        eventType:
          type: string
          description: >
            One dotted event type. It must exist at this subscription's
            `destination.version` **and** be one this subscription's `eventTypes`
            selects.
          example: order.shipped
        confirmationId:
          type: string
          format: uuid
          description: >
            One of your own orders, named by its confirmation ID, for the webhook
            to be built from. Omit it to fire against the synthetic order WHCC
            keeps for your account.


            It must name an order on the calling account: anything else answers
            `404 confirmation_not_found`, which covers "no such order" and
            "somebody else's order" with one response. Nothing is written to the
            order, and its state is not advanced -- the notification is built
            from it and delivered, and that is all.
          example: 8f14e45f-ceea-467a-9f3c-4f2d1a6b7c05

    AcceptedTestEvent:
      type: object
      description: >
        A test event that has been queued for delivery. The attempt happens
        afterwards on the ordinary pipeline and may ultimately fail, so nothing
        here reports that your endpoint received anything.
      required: [notifyUid, eventType, subscriptionId, orderNumber]
      properties:
        notifyUid:
          type: integer
          description: >
            The correlation handle. Quote it when asking WHCC where a test event
            went -- it is what identifies this notification everywhere inside
            WHCC, including the delivery log.
          example: 84512203
        eventType:
          type: string
          description: The dotted type that was queued, echoing what you sent.
          example: order.shipped
        subscriptionId:
          type: string
          description: >
            The subscription named in the request, echoed back. It is the one
            this request was validated against -- ownership, `eventTypes` and the
            signing-secret pre-flight -- and it is **not** the only destination:
            every subscription on the account receives the event, whatever its
            status. No legacy consumer callback receives it.
          example: SUB_7Kq2mZ1x9PdR4t
        orderNumber:
          type: integer
          nullable: true
          description: >
            The order number the webhook carries if it is delivered, or **null**
            where it will carry none. It is null for `order.rejected`, because an
            image-rejection notification carries no order number in real life
            either; and it is null for an order named by `confirmationId` that
            has not been assigned one yet, for the same reason -- there is no
            number for the delivery to carry.


            Without `confirmationId` it is the synthetic order's, drawn from a
            reserved band above every real order number, so it can never collide
            with one of your orders. With one it is that order's own.
          example: 900041823

    EventSubscriptionProblemDetails:
      description: >
        RFC 7807 Problem Details for this resource, extended with a stable
        machine-readable `code` so callers can branch without parsing `detail`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: >
                One of `malformed_request`, `insufficient_scope`,
                `subscription_not_found`, `subscription_limit_reached`,
                `incomplete_event_coverage`, `unknown_event_type`,
                `event_type_unavailable_for_version`,
                `event_type_not_selected`, `unsupported_destination_type`,
                `invalid_callback_uri`, `invalid_signing_secret`,
                `invalid_webhook_version`, `webhook_version_unsupported`,
                `destination_version_immutable`, `etag_mismatch`,
                `idempotency_key_conflict`, `no_signing_secret`, `shipped_dedup_pending`,
                `confirmation_not_found`,
                `event_type_unavailable_in_environment`, `rate_limited`,
                `rotation_in_progress` or `invalid_expires_in`.
              example: incomplete_event_coverage
            missing:
              type: array
              description: >
                Present on `incomplete_event_coverage`: the event types the
                selection implies but does not include.
              items:
                type: string
              example: ['order.rejected']
            previousSecretExpiresAt:
              type: string
              format: date-time
              description: >
                Present on `rotation_in_progress`: when the open overlap
                window closes. Rotate again after this instant.
              example: '2026-09-21T10:12:04Z'

    MintProblemDetails:
      description: >
        RFC 7807 Problem Details for a declined mint, extended with a
        stable machine-readable `code` (`mint_ineligible` for 422,
        `mint_velocity_limited` for 429, `mint_unavailable` for 503) so
        callers can branch without parsing `detail`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              example: mint_ineligible

    CancelActionsRequest:
      type: object
      description: >
        This operation takes its input from the path and the caller's identity,
        so there is nothing to send. The body may be omitted entirely or sent as
        `{}`; any key is rejected with `400` rather than ignored.
      additionalProperties: false

    CancelActions:
      type: object
      description: >
        A cancel token, when it stops being honoured, and the eligibility answer
        it was minted against. The snapshot travels with the token so a caller
        showing a confirm button has the promise and the answer the promise was
        made about from a single read, taken at a single instant.
      required: [token, expiresAt, cancelEligibility]
      properties:
        token:
          type: string
          description: >
            Send this back as `cancelToken` in the `POST
            /orders/{id}/cancellation` body. Opaque: its contents are this
            service's own and no other party mints or verifies it. Usable
            exactly once.
          example: eyJvcmRlcklkIjoiRk9fQnYzakw4c041eFc2aFpmIn0.k7bR3xQ9pT2mN5wY
        expiresAt:
          type: string
          description: >
            When the token stops being honoured -- 300 seconds after it was
            minted. Past this, redemption is `422 cancel_token_expired`.
          example: '2026-02-07T06:28:27.393-06:00'
        cancelEligibility:
          $ref: '#/components/schemas/CancelEligibility'

    CancellationRequest:
      type: object
      description: >
        Carries the cancel token this operation redeems. Any other key is
        rejected with `400` rather than ignored, so a caller is never left
        believing it supplied something that was never read.
      additionalProperties: false
      required: [cancelToken]
      properties:
        cancelToken:
          type: string
          description: >
            The token from `POST /orders/{id}/cancel-actions`, carried in the
            body rather than the request line so it does not land in access
            logs.


            **Required.** A request without one -- or with an empty one -- is
            `400 cancel_token_invalid`, folded in with every other mismatch. An
            optional single-use token would not be single-use: replay protection
            that can be defeated by omitting a field is no protection at all.


            The token is not an authorization credential. The scope gate and the
            account-ownership check run on every request and neither is ever
            satisfied from the token's contents -- what the token buys is the
            freshness grace described on the mint operation, and nothing else.
          example: eyJvcmRlcklkIjoiRk9fQnYzakw4c041eFc2aFpmIn0.k7bR3xQ9pT2mN5wY

    CancellationResult:
      type: object
      description: >
        Which order was acted on, and which of the two terminal states the
        request ended in. The order resource itself is not embedded -- see the
        operation description.
      required: [id, orderNumber, outcome]
      properties:
        id:
          type: string
          description: Order identifier, in the same form order detail reports it.
          example: FO_Bv3jL8sN5xW6hZf
        orderNumber:
          type: string
          example: '90000003'
        outcome:
          $ref: '#/components/schemas/CancellationOutcome'

    CancellationOutcome:
      type: string
      description: |
        Where the order ended up. The two states are exhaustive: a request that
        was not refused ends in exactly one of them.

        - cancellation_requested: the ask is recorded and a person is completing it. The order shows `Request to Cancel Order`.
        - canceled: the order is voided and the money is on its way back.
      enum: [cancellation_requested, canceled]
      example: cancellation_requested

    CancelTokenProblemDetails:
      description: >
        RFC 7807 Problem Details for a refused cancel token. It carries no
        `cancelEligibility`, because none of these refusals is an answer about
        the order: an expired or already-spent token says nothing about whether
        the order can still be canceled, and the answer to all three is to
        request eligibility again.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            code:
              type: string
              description: >
                Stable machine-readable identifier for the refusal. Absent when
                a `400` was a malformed body rather than a refused token.
              enum:
                [
                  cancel_token_invalid,
                  cancel_token_expired,
                  cancel_token_already_used,
                ]
              example: cancel_token_expired

    CancellationInProgressProblemDetails:
      description: >
        RFC 7807 Problem Details for a cancellation refused because another
        attempt for the same order is still running. Nothing was done to the
        order by this request; once that attempt finishes, a repeat is answered
        `200` with the outcome it reached.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier for the refusal.
              enum: [cancellation_in_progress]
              example: cancellation_in_progress

    CancellationProblemDetails:
      description: >
        RFC 7807 Problem Details for a refused cancellation, extended with the
        order's own eligibility answer so a caller can explain the refusal
        without re-reading the order. `status` at the top level is RFC 7807's
        own member -- the HTTP status code; the status that blocked the
        cancellation is `cancelEligibility.status`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code, cancelEligibility]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier for the refusal.
              enum: [order_not_cancelable]
              example: order_not_cancelable
            cancelEligibility:
              description: >
                The order's eligibility answer, in exactly the encoding order
                detail carries at the same property name -- the refusal and the
                displayed flag are one derivation, not two.
              allOf:
                - $ref: '#/components/schemas/CancelEligibility'

    PaymentMethodActionsRequest:
      type: object
      description: >
        All fields optional. Absent, JSON `null`, or an empty string all
        mean "not supplied" for a given field. Every field -- INCLUDING
        `client_ip`, whose own `maxLength` below (45) reflects the longest
        valid IP literal rather than this server-wide bound -- is still
        rejected (`400`) past 2048 characters: a URL beyond that length
        already breaks in browsers, and this bounds how much a caller can
        bloat the resulting launch token's claims. Duplicate JSON keys are
        last-wins (standard JSON parsing behavior); unknown/extra keys in
        the body are silently ignored. This shape/length check is the only
        thing that rejects `client_ip` with a `400` -- a syntactically
        invalid IP literal (of any length up to 2048 characters) is a
        fallback, not a `400` (see the field description below).
      properties:
        return_to:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            Where the card page should send the user back to after the flow
            completes. Validated by exact origin (scheme+host) against a
            server-side allowlist; an absent or disallowed value falls back
            to a default URL for the account's brand. The path and query
            string portion of an allowed URL are preserved as given.
          example: 'https://www.whcc.com/checkout/resume'
        cancel_to:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            Where the card page's Cancel link (and the decline/error pages'
            return links) should send the user. Validated by exact origin
            (scheme+host) against the same server-side allowlist as
            `return_to`, but with no default: when absent, disallowed, or
            malformed, the launch token's `cancel_to` claim is omitted
            entirely and the card page falls back to the origin of
            `return_to`. The path and query string portion of an allowed
            URL are preserved as given.
          example: 'https://www.whcc.com/checkout/cancel'
        cart_id:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            Opaque identifier passed through into the launch token's
            `return_context.cart_id` claim so the return_to page can resume
            the right cart.
          example: cart_abc123
        client_ip:
          type: string
          nullable: true
          maxLength: 45
          format: ip
          description: >
            The end shopper's own IP address, forwarded by the calling
            first-party service so shopper-level rate limiting attributes
            the mint to the actual shopper rather than the calling server.
            Should be a syntactically valid IPv4 or IPv6 literal (no CIDR
            ranges, no port, no bracketed IPv6; 45 characters is the
            longest possible IPv6 textual form). This is a value contract,
            not a request-shape constraint: a present value that isn't a
            valid IP literal is treated exactly like an absent value --
            shopper-level limiting falls back to the connection's own
            source IP, and the mint is never declined or 400'd because of
            it.
          example: '203.0.113.42'

  responses:
    BadRequest:
      description: >
        Bad request: a malformed or unsupported request. Also the answer when
        `WHCC-API-Version` names a version this API does not serve, before
        authentication and without version headers: `type`
        `https://developer.whcc.com/problems/unsupported-api-version`, and a
        `supportedVersions` member listing the months you may send.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
    UnsupportedApiVersion:
      description: >
        `WHCC-API-Version` names a version this API does not serve. Decided
        before authentication and before the route, so the answer is the same
        for every request and says nothing about the account. `supportedVersions`
        lists the months you may send. Carries none of the version headers.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnsupportedApiVersionProblemDetails'
    Forbidden:
      description: >
        Forbidden -- missing or insufficient authentication/scope. On an
        operation not marked `x-whcc-api-key: true`, a credential carrying only
        `apikey` gets this response: those operations require `client` or
        `superadmin`. The `detail` names the set the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    EventSubscriptionNotFound:
      description: >
        No such subscription on your account. One answer covers both "no
        subscription has this identifier" and "this one belongs to someone else",
        deliberately: two would let a caller enumerate other accounts'
        subscription identifiers.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EventSubscriptionProblemDetails'
    ShippingNotFound:
      description: >
        **Two shapes, told apart by whether `code` is present.** No `code` means
        no such order on your account -- the same answer `GET /orders/{id}`
        gives, and deliberately identical so that ownership reads the same
        everywhere in this document. A `code` is a refusal from the service
        behind this one: `order-not-found`, or `shipment-not-found` where the
        order exists but has no live shipment record.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AnyShippingProblemDetails'
    ShippingUpstreamConflict:
      description: >
        A property of the order rather than of your request, so the identical
        request will keep being refused until the order changes. Read `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ShippingProblemDetails'
    ShippingBadGateway:
      description: >
        The shipping resource could not be read. The failure is in the service
        behind this one rather than in this one, so your order is unchanged and
        the request is safe to repeat.


        **A `code` is present when that service said what went wrong** --
        `read-failed` or `unhandled-error`, relayed under this status because
        the failure is not this service's. Its absence means this service could
        not tell what happened, which is a different thing and is why the two
        are distinguishable rather than merged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AnyShippingProblemDetails'
    ShippingPreviewBadGateway:
      description: >
        The change could not be previewed. The failure is in the service behind
        this one rather than in this one, so your order is unchanged -- nothing
        was going to be written in any case -- and the request is safe to
        repeat.


        **A `code` is present when that service said what went wrong** --
        `read-failed` or `unhandled-error`, relayed under this status because
        the failure is not this service's. Its absence means this service could
        not tell what happened, which is a different thing and is why the two
        are distinguishable rather than merged.


        ⚠️ **`read-failed` here also covers a tax that could not be calculated
        for the address you asked about**, including an address the tax service
        will not accept. The preview settles the same money the change would, so
        a tax it cannot compute is a preview it cannot answer. One that keeps
        failing on the same address, and succeeds on others, is telling you
        something about that address rather than about this service.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AnyShippingProblemDetails'
    MethodNotAllowed:
      description: >
        HTTP method not allowed for this path. The `Allow` response header
        names the method(s) this path does support (varies by path -- e.g.
        `GET` for the read-only routes, `POST` for the mint route).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        Allow:
          schema:
            type: string
          description: Comma-separated list of methods this path supports.
          example: GET
    ReadTimedOut:
      description: >
        The request took too long to answer. It only reads, so nothing was
        changed and it is safe to send again: wait the number of seconds
        `Retry-After` gives first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
